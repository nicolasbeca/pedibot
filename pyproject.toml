[project]
name = "pedibot"
version = "2.0.0a0"
description = "Pediatric assistant that answers only from verified medical guidelines, with citations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "typer>=0.12",
    "openai>=1.40",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "beautifulsoup4>=4.15.0",
    "python-telegram-bot>=22.8",
    "atproto>=0.0.71",
    "tweepy>=4.17.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0", "sqlite-vec>=0.1"]

[project.scripts]
pedibot = "pedibot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pedibot"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
[tool.ruff.lint.per-file-ignores]
"src/pedibot/bot/answer.py" = ["E501"]   # user-facing sentences
"src/pedibot/bot/dose.py" = ["E501"]
"src/pedibot/cli.py" = ["E501", "B008"]  # typer idiom
"src/pedibot/index/store.py" = ["E501"]
"src/pedibot/api.py" = ["E501"]
"src/pedibot/bot/judge.py" = ["E501"]
"src/pedibot/bot/ors.py" = ["E501"]
"src/pedibot/telegram_bot.py" = ["E501"]
"src/pedibot/publish/articles.py" = ["E501"]
"src/pedibot/publish/social.py" = ["E501"]
"src/pedibot/admin.py" = ["E501"]
"src/pedibot/ops/report.py" = ["E501"]
"src/pedibot/ops/store.py" = ["E501"]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
ignore_missing_imports = true
