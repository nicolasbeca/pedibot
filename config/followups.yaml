# Las preguntas que vienen después (12-sep-2026).
#
# Tras «tiene fiebre» viene «¿cuánto paracetamol?» o «¿cuándo voy a urgencias?». El chat las
# ofrece como botones debajo de la respuesta, según el asunto de la taxonomía que la respuesta
# tocó, en la lengua del padre. Cada pregunta de esta tabla TIENE FUENTE en el corpus: hay una
# prueba que la busca en su lengua (tests/test_the_chat_keeps_the_thread.py), porque una pregunta
# que ofrecemos nosotros y acaba en «no tengo fuente» es peor que ninguna. Nunca se ofrecen
# sobre una respuesta con nivel emergencia: ahí el padre tiene que estar llamando.
#
# Dos o tres por asunto y lengua: caben en la pantalla de un móvil sin desplazar.
