  # 18-sep-2026. «Er kann nicht atmen» —«no puede respirar»— daba RUTINA, que es la frase más
  # urgente que un padre alemán puede escribir. El guardián de la negación veía el «nicht»
  # delante de «atmen» y callaba la regla; en castellano, inglés y francés no pasaba porque
  # allí el patrón EMPIEZA por la negación —«no puede respirar», «cannot breathe», «ne peut
  # pas respirer»— y el guardián respeta eso a propósito. En alemán el verbo se va al final y
  # la negación queda en medio, así que el patrón tiene que llevarla dentro (L173: la negación
  # puede SER la señal).
  - (kann|konnte) (er |sie |es |das kind |das baby )?(kaum|nicht|nicht mehr|gar nicht) (richtig )?atmen
