- id: severe_breathing
  level: emergency
  source: seup_acudir_urgencias
  reason_es: Dificultad para respirar grave (se marcan las costillas, respira muy rápido, pausas en la respiración, color azulado)
  reason_en: Severe breathing difficulty (ribs pulling in, very fast breathing, pauses in breathing, blue colour)
  reason_fr: Difficulté grave à respirer (côtes qui se creusent, respiration très rapide, pauses respiratoires, coloration bleutée)
  patterns:
  # ── suajili (18-sep-2026, fase 3 de África) ──
  - "hapumui (vizuri|kabisa)"
  - "anapumua kwa (shida|tabu) (sana|kubwa)"
  - "mbavu zin(a|ai)ingia ndani"
  - "anashindwa kupumua"
  # «hawezi kupumua» es «no puede respirar»: la negación va dentro del verbo (18-sep-2026).
  - "hawezi ku(pumua|vuta pumzi)"
  # 17-sep-2026, segundo intento. Pedir «al respirar» dejaba fuera la forma normal de
  # contarlo —«no tiene fiebre pero se le marcan las costillas»— y lo cazó una prueba vieja.
  # Ahora el patrón es amplio otra vez y lo que se excluye es la DELGADEZ, que es la
  # excepción y tiene su propia regla (`visible_severe_wasting`): «está muy delgado, se le
  # marcan las costillas y no gana peso» no es un tiraje, es desnutrición.
  - (se le )?(marcan|hunden|meten|retraen).{0,10}(las )?costillas(?![^.]{0,60}(delgad|flaqu|flac|no gana peso|perdido peso|adelgaz|piel y huesos))
  - (delgad\w*|flaqu\w*)[^.]{0,40}costillas[^.]{0,40}(al respirar|cuando respira)
  # 17-sep-2026: «не может дышать» se apagaba solo: la negación va DENTRO de la señal, y
  # el patrón ruso no la incluía, así que el guardián de negaciones lo anulaba.
  - не (может|можешь|в силах) дышать
  - (не дышит|перестал\w* дышать|дышать не может)
  # 17-sep-2026: la dificultad dicha como sustantivo en árabe e hindi.
  - (صعوبة|ضيق)[^.]{0,15}(شديدة?|كبيرة?)?[^.]{0,12}(في )?(التنفس|النفس)
  - (يعاني|تعاني)[^.]{0,25}(التنفس|النفس)
  - (साँस|सांस)[^.]{0,20}(लेने में)?[^.]{0,15}(बहुत )?(तकलीफ़|तकलीफ|दिक्कत|परेशानी)
  # 17-sep-2026: el tiraje costal es dificultad GRAVE, y en francés y portugués caía en la
  # moderada o en nada. «Afundando as costelas» estaba escrito; «as costelas afundam», no.
  - (c[ôo]tes)[^.]{0,25}(se creusent|se creuse|rentrent|se rentrent)
  - creusement[^.]{0,20}(c[ôo]tes|sous.?costal|intercostal)
  - (costelas)[^.]{0,25}(afundam|afundando|a afundar|marcadas|repuxam|puxam)
  - (tiragem|adejo nasal|batimento das asas do nariz)
  - respira muito (depressa|r[aá]pido|rapidamente)
  # 16-sep-2026, dialecto: «شفايفه زرقا» son los labios azules del Golfo y Egipto.
  - "(شفايف|شفايفه|شفايفها|شفتيه).{0,20}(زرق|زرقا|زرقاء|زرقه)"
