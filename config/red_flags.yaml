  - dificultades para respirar
  - respira con dificultad
  - problemas? para respirar
  - respira cada vez (peor|m[aá]s deprisa|m[aá]s r[aá]pido)
  - (respira|respirando|respiraci[oó]n).{0,25}cada vez (peor|m[aá]s deprisa|m[aá]s r[aá]pid)
