rules:
# OJO: un DESMAYO no entra aquí. Se probó el 6-sep-2026 y bajó la precisión de las alarmas
# de 1.0 a 0.978: «se ha desmayado en el colegio, tiene 12 años» pasaba a emergencia. La hoja
# de síncope de la SEUP dice que «en general no se producen por problemas médicos
# importantes», y define el síncope como «una pérdida de conocimiento de forma brusca y de
# corta duración». Esta regla es para quien NO responde AHORA.
- id: not_responding
  level: emergency
  source: seup_acudir_urgencias
  reason_es: No responde a estímulos
  reason_en: Not responding to stimuli
  reason_fr: Ne répond pas aux stimulations
  patterns:
  # 18-sep-2026: «no consigo despertarlo» en seis lenguas. En inglés ya saltaba por otra vía y
  # en las demás no había nada: es la misma frase y el mismo miedo.
  - "(n'arrive pas|ne r[ée]ussis pas|impossible)[^.]{0,20}(à le r[ée]veiller|à la r[ée]veiller)"
  - "kann (ihn|sie|es)[^.]{0,20}nicht[^.]{0,12}(wach|aufwecken|wecken)"
  - "не мог[уа][^.]{0,20}разбудить"
  - "(n[ãa]o consigo|n[ãa]o consegue)[^.]{0,20}(acord[áa]|despert)"
  - "(जगा|उठा) नहीं पा"
  - "siwezi ku(mwamsha|mwinua)"
  - "(لا أستطيع|ما أقدر)[^.]{0,20}(إيقاظه|أيقظه)"
  # y la forma francesa y suajili de «no responde cuando le hablo»
  - "ne r[ée]pond (plus |pas )?(quand|lorsque)"
  - "hajibu[^.]{0,22}(ninapomwita|nikimwita|namwita|nikiongea)"
  # ── suajili (18-sep-2026, fase 3 de África) ──
  - "hajitambui"
  - "hajibu (anapo|akiitwa|kabisa)"
  - "amepoteza fahamu"
  - "hana fahamu"
  # 17-sep-2026: «lleva media hora sin responder» salía RUTINA. La negación vuelve a ser la
  # señal —«sin responder»— y encima con el tiempo delante, que es como se cuenta.
  - (lleva|llevamos)[^.]{0,25}(sin (responder|reaccionar|despertarse|abrir los ojos))
  - (sin (responder|reaccionar))[^.]{0,25}(desde hace|hace)[^.]{0,15}(minutos|media hora|una hora|horas)
  - (has been|for)[^.]{0,20}(unresponsive|not responding)[^.]{0,20}(for|since)?
  - (ne r[ée]pond plus depuis|sans r[ée]action depuis)
  - (reagiert seit)[^.]{0,20}(nicht)
  - (не реагирует уже|без сознания уже)
  - (لا يستجيب منذ|فاقد الوعي منذ)
  # 18-sep-2026: en árabe la negación va delante del verbo y ES la señal: «لا يستيقظ» es «no
  # se despierta» y «لا يستجيب» es «no responde». Sin la frase entera dentro del patrón, el
  # guardián de la negación las callaba (L173).
  - (لا يستيقظ|لا يفيق|لا يستجيب|لا يتحرك)
  - (n[aã]o responde h[áa])
  - (से कोई प्रतिक्रिया नहीं|से बेहोश)
  # 17-sep-2026: en castellano el «no responde» cazaba la reanimación; en inglés, no.
  - (doing|started|performing|giving)[^.]{0,15}(cpr|mouth to mouth|rescue breaths|chest compressions)
  - (le estoy haciendo|haciendo)[^.]{0,15}(rcp|boca a boca|compresiones)
  - (не дышит и не|делаю (сердечно.?л[ёе]гочную )?реанимацию|искусственное дыхание)
  - (أقوم ب|أعمل)[^.]{0,15}(إنعاش|تنفس اصطناعي)
  - (सीपीआर|कृत्रिम साँस)[^.]{0,15}(दे रहा|दे रही|कर रहा)
  # 17-sep-2026: «reagiert nicht» estaba, pero un padre alemán escribe «reagiert auf
  # nichts» o «antwortet nicht», y la negación va en otro sitio.
  - reagiert (auf )?(gar )?(nichts|nicht mehr|[üu]berhaupt nicht)
  - antwortet (mir )?nicht
  - nicht mehr ansprechbar
  # 16-sep-2026, dialecto del Golfo: «مو صاحي» es «no está despierto».
  - "(مو|مب|مش) (صاحي|صاحية|واعي|فايق)"
  - "(ما|مو) (يصحى|يفيق|بيفيق)"
  # 16-sep-2026: «tarda en recuperar la consciencia más de 3 minutos» lo advierte nuestra
  # guía árabe del desmayo y el triaje lo veía como rutina.
  - "تأخر.{0,30}استعاد(ة|ته).{0,15}الوعي"
  - "لم (يستعد|تستعد).{0,15}الوعي"
  - "(لا|لم) (يفيق|تفيق)"
  - ne reprend pas connaissance
  - (has not|hasn'?t|did not|didn'?t) (come round|come to|regained? consciousness)
  - tarda en (recuperar|volver en s[ií])
  - no responde
  - no reacciona
  - inconsciente
  - no se despierta
  - (ausencia|falta) de (respuesta|reacci[oó]n)(?!.{0,30}(tratamiento|antibi[oó]tic|medicaci|f[aá]rmac|jarabe))
  - (lack|absence) of (response|responsiveness|reaction)(?!.{0,30}(treatment|antibiotic|medicine|medication))
