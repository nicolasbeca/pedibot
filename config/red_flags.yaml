# ══════════════════════════════════════════════════════════════════════════════════════════════
# África, fase 2 del plan (18-sep-2026)
#
# Medido antes de escribir nada: de 41 frases con las que un padre africano cuenta lo que mata
# niños en su continente, **29 salían mal**. La palidez palmar no existía en ninguna lengua; una
# frecuencia respiratoria contada por la madre —que es LA herramienta del IMCI donde no hay
# radiografía— salía como rutina; «diarrea como agua de arroz» también; y el paludismo con un
# niño somnoliento se quedaba en urgente en vez de emergencia.
#
# Las fuentes son las que ya estaban en el corpus, salvo el cólera, que no tenía ni una ficha y
# se ha añadido hoy (OMS, cinco idiomas). El cuadro de procedimientos del IMNCI —la adaptación
# india del IMCI de la OMS— es el que trae los signos generales de peligro, la palidez palmar y
# los umbrales de respiración por edad.
#
# Y lo que no se ha hecho: NO se ha metido una regla por país ni por continente. Un niño con
# palidez palmar en Madrid tiene la misma anemia que uno en Kampala, y una regla que sólo
# saltara para África sería exactamente el racismo blando que este trabajo venía a deshacer.
# ══════════════════════════════════════════════════════════════════════════════════════════════

