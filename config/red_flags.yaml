#
# Por qué urgente y no emergencia, con lo que dice el corpus: la sinovitis transitoria —la causa
# más frecuente de cojera en un niño pequeño— cursa con temperatura POR DEBAJO de 38 ºC, y su
# diagnóstico diferencial principal es la artritis séptica; el manual pide «siempre descartar
# infecciones o fracturas ocultas, que son los cuadros más urgentes de diagnosticar». Cojera más
# fiebre es la combinación que hay que ver el mismo día. Cojera sola, no: casi siempre es una
# piedra en el zapato o un golpe que no contó, y un aviso que salta siempre deja de leerse.
#
# En inglés, ojo: «limp» a secas es FLOJO, y de eso se ocupa `drowsy_irritable`. Aquí se exige
# «limping», «limps» o «a limp», que es andar cojeando y no otra cosa.
# ── Cinco huecos encontrados repasando el chat entero (17-sep-2026) ────────────────────────
# El de la cojera lo encontró el operador usando la web. Estos salieron de buscar los demás por
# el mismo método: sacar del índice los pasajes que enumeran motivos de consulta, partirlos en
# frases y pasárselas al triaje como si las escribiera un padre. De 5.123 frases, 153 sonaban
# graves y salían rutina; leídas a mano, cinco eran huecos de verdad.

# La fontanela abombada es presión dentro de la cabeza. La ficha IMNCI de India —que ya está
# indexada— la pone entre los signos de peligro que obligan a referir de inmediato, junto al
# quejido y las convulsiones. «Mollera» va porque es como se dice en media América.
# ── Lote del 17-sep-2026: urgencias que no tenían puerta ───────────────────────────────────
# Salieron de preguntar «¿QUÉ REGLAS FALTAN?» en vez de «¿funcionan las que hay?». Se le
