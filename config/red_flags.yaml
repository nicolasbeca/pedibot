  - "kifafa"
  - "mwili[^.]{0,12}(unatetemeka|inatetemeka)"
  # 17-sep-2026: «having a fit» en inglés y «припадок» en ruso, que son las dos palabras
  # corrientes para una convulsión.
  - (having|had|has)[^.]{0,15}a fit\b
  - (припадок|приступ судорог)
