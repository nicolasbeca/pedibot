  - ataque epil
  - se ha puesto rígid
  # 18-sep-2026: «se pone rígido» cazaba también al recién nacido que puja para hacer caca y al
  # que se despereza, que es de las cosas que más se preguntan de un bebé y no es una convulsión.
  # Se excluye la causa habitual, no la forma: «se ha quedado rígido» sigue saltando.
