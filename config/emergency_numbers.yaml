UG: {emergency: "999", poison: null, mental: null, note: {en: "Medical help at the scene of an accident is likely to be limited, particularly outside Kampala.", es: "La ayuda médica en el lugar de un accidente suele ser limitada, sobre todo fuera de Kampala.", fr: "Les secours médicaux sur les lieux d'un accident sont souvent limités, surtout hors de Kampala.", de: "Die medizinische Hilfe am Unfallort ist meist begrenzt, besonders außerhalb von Kampala.", ru: "Медицинская помощь на месте происшествия обычно ограничена, особенно за пределами Кампалы.", ar: "المساعدة الطبية في موقع الحادث محدودة غالبا، خاصة خارج كمبالا.", pt: "A ajuda médica no local de um acidente costuma ser limitada, sobretudo fora de Campala.", hi: "दुर्घटना स्थल पर चिकित्सा सहायता आमतौर पर सीमित होती है, ख़ासकर कंपाला के बाहर।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/uganda/health"}
