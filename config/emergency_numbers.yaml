KM: {emergency: null, poison: null, mental: null, no_national: true, note: {en: "There is no national emergency number: the source lists hospital numbers instead.", es: "No hay número nacional de urgencias: la fuente da los teléfonos de los hospitales.", fr: "Il n'y a pas de numéro national d'urgence : la source donne les numéros des hôpitaux.", de: "Es gibt keine landesweite Notrufnummer: Die Quelle nennt stattdessen Krankenhausnummern.", ru: "Единого номера экстренной службы нет: источник приводит номера больниц.", ar: "لا يوجد رقم طوارئ وطني: المصدر يورد أرقام المستشفيات بدلا من ذلك.", pt: "Não há número nacional de emergência: a fonte indica os números dos hospitais.", hi: "कोई राष्ट्रीय आपातकालीन नंबर नहीं है: स्रोत अस्पतालों के नंबर देता है।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/comoros/health"}
LR: {emergency: null, poison: null, mental: null, no_national: true, note: {en: "There is no reliable ambulance service in Liberia.", es: "En Liberia no hay un servicio de ambulancias fiable.", fr: "Il n'y a pas de service d'ambulance fiable au Liberia.", de: "In Liberia gibt es keinen verlässlichen Rettungsdienst.", ru: "В Либерии нет надёжной службы скорой помощи.", ar: "لا توجد خدمة إسعاف موثوقة في ليبيريا.", pt: "Na Libéria não há um serviço de ambulâncias fiável.", hi: "लाइबेरिया में कोई भरोसेमंद एम्बुलेंस सेवा नहीं है।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/liberia/health"}
LS: {emergency: "112", poison: null, mental: null, note: {en: "If 112 is not operating, call locally on 80093030121. You can also access emergency treatment across the border in South Africa.", es: "Si el 112 no funciona, llama al 80093030121. También se puede recibir atención de urgencia cruzando a Sudáfrica.", fr: "Si le 112 ne fonctionne pas, appelez le 80093030121. Il est aussi possible d'être soigné en urgence de l'autre côté de la frontière, en Afrique du Sud.", de: "Wenn die 112 nicht funktioniert, rufen Sie 80093030121 an. Notfallbehandlung ist auch jenseits der Grenze in Südafrika möglich.", ru: "Если 112 не работает, звоните на 80093030121. Экстренную помощь можно получить и за границей, в ЮАР.", ar: "إن لم يعمل الرقم 112، فاتصل بالرقم 80093030121. ويمكن أيضا تلقي علاج طارئ عبر الحدود في جنوب أفريقيا.", pt: "Se o 112 não funcionar, ligue para 80093030121. Também é possível receber tratamento de urgência do outro lado da fronteira, na África do Sul.", hi: "अगर 112 काम न करे, तो 80093030121 पर कॉल करें। सीमा पार दक्षिण अफ़्रीका में भी आपातकालीन इलाज मिल सकता है।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/lesotho/health"}
MG: {emergency: "117 from a mobile / 17 from a landline", poison: null, mental: null, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/madagascar/health"}
ML: {emergency: "15", poison: null, mental: null, note: {en: "Emergency response capacity is very limited. Take local advice and arrange your own transport to a medical centre or hospital.", es: "La capacidad de respuesta es muy limitada. Pregunta allí mismo y organiza tú el transporte a un centro médico u hospital.", fr: "Les capacités d'intervention sont très limitées. Demandez sur place et organisez vous-même le transport vers un centre médical ou un hôpital.", de: "Die Einsatzkapazitäten sind sehr begrenzt. Fragen Sie vor Ort und organisieren Sie den Transport zu einem Gesundheitszentrum oder Krankenhaus selbst.", ru: "Возможности экстренных служб очень ограничены. Спросите на месте и сами организуйте транспорт до медицинского центра или больницы.", ar: "قدرة الاستجابة محدودة جدا. اسأل في مكانك ودبر بنفسك وسيلة للوصول إلى مركز طبي أو مستشفى.", pt: "A capacidade de resposta é muito limitada. Pergunte no local e organize o seu próprio transporte até um centro médico ou hospital.", hi: "आपातकालीन सेवा की क्षमता बहुत सीमित है। वहीं पूछें और चिकित्सा केंद्र या अस्पताल तक पहुँचने का इंतज़ाम खुद करें।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/mali/health"}
MR: {emergency: "101", poison: null, mental: null, note: {en: "The Mauritania authorities may not answer calls to this number.", es: "Puede que las autoridades de Mauritania no contesten a este número.", fr: "Il se peut que les autorités mauritaniennes ne répondent pas à ce numéro.", de: "Es kann sein, dass die mauretanischen Behörden unter dieser Nummer nicht antworten.", ru: "Власти Мавритании могут не отвечать по этому номеру.", ar: "قد لا ترد سلطات موريتانيا على هذا الرقم.", pt: "As autoridades da Mauritânia podem não atender este número.", hi: "हो सकता है कि मॉरिटानिया के अधिकारी इस नंबर पर जवाब न दें।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/mauritania/health"}
MU: {emergency: "999 / 114", poison: null, mental: null, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/mauritius/health"}
MW: {emergency: "998", poison: null, mental: null, note: {en: "Emergency numbers are unreliable in Malawi. There may be other numbers for the areas you are in — ask locally.", es: "Los números de urgencias no son fiables en Malaui. Puede haber otros números según la zona: pregunta allí mismo.", fr: "Les numéros d'urgence ne sont pas fiables au Malawi. Il peut y avoir d'autres numéros selon la zone : demandez sur place.", de: "Die Notrufnummern in Malawi sind unzuverlässig. Je nach Gegend kann es andere Nummern geben — fragen Sie vor Ort.", ru: "Номера экстренных служб в Малави ненадёжны. В вашем районе могут быть другие номера — спросите на месте.", ar: "أرقام الطوارئ في ملاوي غير موثوقة، وقد تكون هناك أرقام أخرى حسب المنطقة، فاسأل في مكانك.", pt: "Os números de emergência não são fiáveis no Maláui. Pode haver outros números consoante a zona: pergunte no local.", hi: "मलावी में आपातकालीन नंबर भरोसेमंद नहीं हैं। इलाक़े के हिसाब से दूसरे नंबर हो सकते हैं — वहीं पूछें।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/malawi/health"}
