ER: {emergency: "122244", poison: null, mental: null, note: {en: "Please note that the call handler may not speak English.", es: "Ten en cuenta que quien conteste puede no hablar inglés.", fr: "Sachez que la personne qui répond peut ne pas parler anglais.", de: "Beachten Sie, dass die Person am Telefon möglicherweise kein Englisch spricht.", ru: "Учтите, что оператор может не говорить по-английски.", ar: "انتبه إلى أن من يرد قد لا يتحدث الإنجليزية.", pt: "Tenha em conta que quem atende pode não falar inglês.", hi: "ध्यान दें कि फ़ोन उठाने वाला अंग्रेज़ी न बोलता हो, यह हो सकता है।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/eritrea/health"}
