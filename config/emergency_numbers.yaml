GM: {emergency: null, poison: null, mental: null, no_national: true, note: {en: "There is no equivalent to a national emergency number in The Gambia; it is best to ask in person at local stations for emergency contact details.", es: "En Gambia no hay un número nacional de urgencias equivalente; lo mejor es preguntar en persona en las comisarías locales por los teléfonos de urgencia.", fr: "En Gambie, il n'existe pas de numéro national d'urgence équivalent ; le mieux est de demander sur place, dans les postes locaux, les numéros d'urgence.", de: "In Gambia gibt es keine vergleichbare landesweite Notrufnummer; am besten fragen Sie persönlich bei den örtlichen Wachen nach Notfallnummern.", ru: "В Гамбии нет аналога единого номера экстренной службы; лучше лично спросить контакты в местных отделениях.", ar: "لا يوجد في غامبيا ما يعادل رقم الطوارئ الوطني؛ والأفضل أن تسأل شخصيا في المراكز المحلية عن أرقام الطوارئ.", pt: "Na Gâmbia não existe um número nacional de emergência equivalente; o melhor é perguntar pessoalmente nos postos locais pelos contactos de emergência.", hi: "गाम्बिया में राष्ट्रीय आपातकालीन नंबर जैसा कुछ नहीं है; सबसे अच्छा है कि स्थानीय थाने में जाकर आपातकालीन संपर्क पूछ लें।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/the-gambia/health"}
GN: {emergency: null, poison: null, mental: null, no_national: true, note: {en: "There is no national emergency number: in Conakry you call the clinics directly.", es: "No hay número nacional de urgencias: en Conakry se llama directamente a las clínicas.", fr: "Il n'y a pas de numéro national d'urgence : à Conakry, on appelle directement les cliniques.", de: "Es gibt keine landesweite Notrufnummer: In Conakry ruft man die Kliniken direkt an.", ru: "Единого номера экстренной службы нет: в Конакри звонят прямо в клиники.", ar: "لا يوجد رقم طوارئ وطني: في كوناكري يُتصل بالعيادات مباشرة.", pt: "Não há número nacional de emergência: em Conacri liga-se diretamente às clínicas.", hi: "कोई राष्ट्रीय आपातकालीन नंबर नहीं है: कोनाक्री में सीधे क्लिनिक को फ़ोन किया जाता है।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/guinea/health"}
