ZW: {emergency: "112 from a mobile phone", poison: null, mental: null, note: {en: "Emergency response capabilities are limited and, in many places, you will need to make local arrangements for transport.", es: "La capacidad de respuesta es limitada y en muchos sitios tendrás que organizar tú el transporte.", fr: "Les capacités d'intervention sont limitées et, dans beaucoup d'endroits, vous devrez organiser vous-même le transport.", de: "Die Einsatzkapazitäten sind begrenzt; vielerorts müssen Sie den Transport selbst organisieren.", ru: "Возможности экстренных служб ограничены, и во многих местах транспорт придётся организовывать самим.", ar: "قدرات الاستجابة محدودة، وفي أماكن كثيرة ستحتاج إلى تدبير وسيلة النقل بنفسك.", pt: "A capacidade de resposta é limitada e, em muitos sítios, terá de organizar o seu próprio transporte.", hi: "आपातकालीन सेवा की क्षमता सीमित है और कई जगहों पर परिवहन का इंतज़ाम आपको ख़ुद करना होगा।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/zimbabwe/health"}

# Los tres que faltaban, leídos con la dirección correcta de la fuente (su URL usa «cote-d-ivoire»
# y «congo», no el nombre largo). Y Zambia estrena un tercer estado: la fuente NO publica número,
# que no es lo mismo que decir que no existe. Poner «no hay» sería ponerle a la fuente palabras
# que no dijo; poner un 112 sería peor. Se dice lo que hay: no lo tenemos verificado.
CI: {emergency: "185", poison: null, mental: null, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/cote-d-ivoire/health"}
CG: {emergency: null, poison: null, mental: null, no_national: true, note: {en: "There is no central number for emergency services. Check for local medical facilities and carry their contact details with you.", es: "No hay un número central de urgencias. Mira qué centros médicos hay cerca y lleva sus teléfonos contigo.", fr: "Il n'y a pas de numéro central pour les urgences. Repérez les structures médicales proches et gardez leurs coordonnées sur vous.", de: "Es gibt keine zentrale Notrufnummer. Erkundigen Sie sich nach Einrichtungen in der Nähe und führen Sie deren Kontaktdaten mit sich.", ru: "Единого номера экстренных служб нет. Узнайте, какие медицинские учреждения есть поблизости, и держите их контакты при себе.", ar: "لا يوجد رقم مركزي للطوارئ. تعرّف على المرافق الطبية القريبة واحتفظ بأرقامها معك.", pt: "Não há um número central de emergência. Veja que unidades médicas existem por perto e leve os contactos consigo.", hi: "आपातकालीन सेवाओं का कोई केंद्रीय नंबर नहीं है। आसपास के चिकित्सा केंद्र देख लें और उनके नंबर साथ रखें।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/congo/health"}
ZM: {emergency: null, poison: null, mental: null, unverified: true, note: {en: "We have not been able to verify a national emergency number for Zambia from a published source. The source we use says only that emergency services are limited.", es: "No hemos podido verificar un número nacional de urgencias para Zambia en ninguna fuente publicada. La fuente que usamos sólo dice que los servicios de urgencias son limitados.", fr: "Nous n'avons pas pu vérifier de numéro national d'urgence pour la Zambie dans une source publiée. La source que nous utilisons indique seulement que les services d'urgence sont limités.", de: "Wir konnten für Sambia keine landesweite Notrufnummer in einer veröffentlichten Quelle bestätigen. Unsere Quelle sagt nur, dass die Notdienste begrenzt sind.", ru: "Нам не удалось подтвердить единый номер экстренной службы для Замбии по опубликованному источнику. Источник говорит лишь, что экстренные службы ограничены.", ar: "لم نتمكن من التحقق من وجود رقم طوارئ وطني لزامبيا في مصدر منشور. والمصدر الذي نستخدمه يقول فقط إن خدمات الطوارئ محدودة.", pt: "Não conseguimos verificar um número nacional de emergência para a Zâmbia numa fonte publicada. A fonte que usamos diz apenas que os serviços de emergência são limitados.", hi: "ज़ाम्बिया के लिए किसी प्रकाशित स्रोत में राष्ट्रीय आपातकालीन नंबर की पुष्टि हम नहीं कर सके। हमारा स्रोत केवल इतना कहता है कि आपातकालीन सेवाएँ सीमित हैं।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/zambia/health"}
