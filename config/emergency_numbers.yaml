# Emergency and helpline numbers by country (ISO 3166-1 alpha-2). "default" when unknown.
# poison: poison control centre. mental: crisis / suicide prevention line.
# The fallback for a reader who has not chosen a country. It is a PHRASE, not a number, so
# it needs one per language: interpolated into the German banner, the English one read
# "Rufen Sie jetzt your local emergency number an". Each is worded to fit the sentence it
# lands in — Spanish says "Llama ahora al {x}", so its phrase starts with "número", not "tu".
default:
  emergency:
    en: "your local emergency number (112 in the EU, 911 in the Americas)"
    es: "número de emergencias de tu país (112 en la UE, 911 en América)"
    fr: "numéro d'urgence de votre pays (112 dans l'UE, 911 en Amérique)"
    de: "Ihre Notrufnummer (112 in der EU, 911 in Amerika)"
    ru: "по местному номеру экстренной службы (112 в ЕС, 911 в Америке)"
    ar: "رقم الطوارئ في بلدك (112 في الاتحاد الأوروبي، 911 في الأمريكتين)"
    pt: "o número de emergência da sua região (112 na UE, 911 nas Américas)"
    hi: "अपने इलाक़े के आपातकालीन नंबर (भारत में 112)"
  poison: null
  mental: null
ES: {emergency: "112", poison: "91 562 04 20 (Instituto Nacional de Toxicología)", mental: "024 (línea de atención a la conducta suicida)"}
PT: {emergency: "112", poison: "800 250 250 (CIAV)", mental: "SNS 24 — 808 24 24 24"}
# India: 112 es el número único oficial (ERSS, Ministerio del Interior). Integra los antiguos
# 100 (policía), 101 (bomberos) y 102/108 (ambulancia). Tele-MANAS 14416 es la línea nacional
# de salud mental del Ministerio de Sanidad. El centro de intoxicaciones se deja vacío: no se
# ha verificado en fuente oficial, y un número de urgencias inventado es peor que ninguno.
IN: {emergency: "112", poison: null, mental: "Tele-MANAS 14416"}
FR: {emergency: "15 / 112", poison: "Centre antipoison (regional)", mental: "3114"}
IT: {emergency: "112", poison: "Centro Antiveleni (regional)", mental: "Telefono Amico 02 2327 2327"}
DE: {emergency: "112", poison: "Giftnotruf (regional)", mental: "0800 111 0 111"}
# 17-sep-2026. Lo vio el operador: «en alemán hay pocos números de emergencia, cuando el alemán
# es idioma oficial en varios países». El fichero sólo conocía Alemania. Cada número de aquí abajo
# se leyó en la página del organismo que lo publica, no de memoria:
#   AT  Vergiftungsinformationszentrale (goeg.at) · Telefonseelsorge 142 · Rat auf Draht 147
#   CH  Tox Info Suisse 145 (toxinfo.ch) · Die Dargebotene Hand 143 · Pro Juventute 147
#   LU  Centre Antipoisons 8002 5500 (lo atiende el belga) · SOS Détresse 45 45 45 (454545.lu)
#   BE  Antigifcentrum 070 245 245 · Zelfmoordlijn 1813 · Centre de Prévention du Suicide
# Liechtenstein va sólo con el 112: no he encontrado publicado que Tox Info Suisse lo cubra, y
# un teléfono de urgencias inventado es peor que un hueco.
