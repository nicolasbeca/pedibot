NA: {emergency: "211111 (in Windhoek) / 10111 (everywhere else)", poison: null, mental: null, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/namibia/health"}
NE: {emergency: "15", poison: null, mental: null, note: {en: "Public emergency services can be slow to respond. Some private medical clinics also have ambulance services.", es: "Los servicios públicos de urgencias pueden tardar. Algunas clínicas privadas también tienen ambulancia.", fr: "Les services publics d'urgence peuvent mettre du temps. Certaines cliniques privées disposent aussi d'ambulances.", de: "Die öffentlichen Rettungsdienste können lange brauchen. Einige Privatkliniken haben ebenfalls Krankenwagen.", ru: "Государственные экстренные службы могут ехать долго. У некоторых частных клиник тоже есть скорая.", ar: "قد تتأخر خدمات الطوارئ العامة، وبعض العيادات الخاصة لديها سيارات إسعاف أيضا.", pt: "Os serviços públicos de emergência podem demorar. Algumas clínicas privadas também têm ambulância.", hi: "सरकारी आपातकालीन सेवाएँ देर लगा सकती हैं। कुछ निजी क्लिनिकों के पास भी एम्बुलेंस होती है।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/niger/health"}
NG: {emergency: "112", poison: null, mental: null, note: {en: "There is no national ambulance service and hospital-owned services are extremely limited. You may need to get local advice or arrange local transport.", es: "No hay servicio nacional de ambulancias y el de los hospitales es muy limitado. Puede que tengas que preguntar allí mismo u organizar tú el transporte.", fr: "Il n'y a pas de service national d'ambulances et celui des hôpitaux est très limité. Vous devrez peut-être demander sur place ou organiser vous-même le transport.", de: "Es gibt keinen landesweiten Rettungsdienst, und die Dienste der Krankenhäuser sind sehr begrenzt. Möglicherweise müssen Sie vor Ort fragen oder den Transport selbst organisieren.", ru: "Государственной службы скорой помощи нет, а больничные службы очень ограничены. Возможно, придётся спросить на месте или организовать транспорт самим.", ar: "لا توجد خدمة إسعاف وطنية، وخدمات المستشفيات محدودة جدا. قد تحتاج إلى السؤال في مكانك أو تدبير وسيلة نقل بنفسك.", pt: "Não há serviço nacional de ambulâncias e o dos hospitais é muito limitado. Pode ter de perguntar no local ou organizar o seu próprio transporte.", hi: "कोई राष्ट्रीय एम्बुलेंस सेवा नहीं है और अस्पतालों की सेवाएँ बहुत सीमित हैं। शायद वहीं पूछना पड़े या ख़ुद परिवहन का इंतज़ाम करना पड़े।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/nigeria/health"}
RW: {emergency: "112", poison: null, mental: null, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/rwanda/health"}
SC: {emergency: "999", poison: null, mental: null, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/seychelles/health"}
SL: {emergency: "117", poison: null, mental: null, note: {en: "Ambulance services are unreliable in Freetown and unavailable throughout most of the country. Staff are not usually trained paramedics and often have little or no medical equipment.", es: "Las ambulancias no son fiables en Freetown y en casi todo el país no las hay. Quien va no suele ser personal sanitario formado y a menudo lleva poco o ningún material.", fr: "Les ambulances ne sont pas fiables à Freetown et sont absentes dans la majeure partie du pays. Le personnel n'est généralement pas formé et dispose de peu ou pas de matériel médical.", de: "Die Rettungsdienste in Freetown sind unzuverlässig und im größten Teil des Landes gar nicht vorhanden. Das Personal ist meist nicht ausgebildet und hat wenig oder keine medizinische Ausrüstung.", ru: "Скорая помощь во Фритауне ненадёжна, а на большей части страны её нет. Персонал обычно не имеет подготовки и мало оснащён.", ar: "خدمات الإسعاف غير موثوقة في فريتاون وغير متوفرة في معظم أنحاء البلاد، والعاملون عادة غير مدربين ولا يحملون إلا القليل من المعدات الطبية أو لا يحملون شيئا.", pt: "As ambulâncias não são fiáveis em Freetown e não existem na maior parte do país. O pessoal não costuma ter formação e leva pouco ou nenhum equipamento médico.", hi: "फ़्रीटाउन में एम्बुलेंस सेवा भरोसेमंद नहीं है और देश के अधिकांश हिस्सों में उपलब्ध ही नहीं है। आने वाले कर्मी आमतौर पर प्रशिक्षित नहीं होते और उनके पास चिकित्सा उपकरण कम या बिलकुल नहीं होते।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/sierra-leone/health"}
SN: {emergency: "15", poison: null, mental: null, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/senegal/health"}
SO: {emergency: "999", poison: null, mental: null, note: {en: "If that number does not work, call the Somali Red Crescent on 445 for emergency services.", es: "Si ese número no funciona, llama a la Media Luna Roja somalí al 445.", fr: "Si ce numéro ne fonctionne pas, appelez le Croissant-Rouge somalien au 445.", de: "Wenn diese Nummer nicht funktioniert, rufen Sie den Somalischen Roten Halbmond unter 445 an.", ru: "Если этот номер не работает, звоните в Сомалийский Красный Полумесяц по номеру 445.", ar: "إن لم يعمل ذلك الرقم، فاتصل بالهلال الأحمر الصومالي على 445.", pt: "Se esse número não funcionar, ligue para o Crescente Vermelho da Somália, 445.", hi: "अगर वह नंबर काम न करे, तो सोमाली रेड क्रिसेंट को 445 पर फ़ोन करें।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/somalia/health"}
SS: {emergency: null, poison: null, mental: null, no_national: true, note: {en: "South Sudan does not have an emergency medical public phone number. There are limited private ambulance services, but you have to register with a private clinic first.", es: "Sudán del Sur no tiene un número público de urgencias médicas. Hay algunas ambulancias privadas, pero hay que darse de alta antes en una clínica privada.", fr: "Le Soudan du Sud n'a pas de numéro public d'urgence médicale. Il existe quelques ambulances privées, mais il faut d'abord s'inscrire auprès d'une clinique privée.", de: "Südsudan hat keine öffentliche medizinische Notrufnummer. Es gibt einige private Krankenwagen, aber man muss sich zuvor bei einer Privatklinik anmelden.", ru: "В Южном Судане нет государственного номера скорой помощи. Есть частные службы, но сначала нужно зарегистрироваться в частной клинике.", ar: "لا يوجد في جنوب السودان رقم عام لطوارئ الإسعاف. هناك خدمات إسعاف خاصة محدودة، لكن عليك التسجيل في عيادة خاصة أولا.", pt: "O Sudão do Sul não tem um número público de emergência médica. Há algumas ambulâncias privadas, mas é preciso inscrever-se primeiro numa clínica privada.", hi: "दक्षिण सूडान में कोई सार्वजनिक आपातकालीन चिकित्सा नंबर नहीं है। कुछ निजी एम्बुलेंस सेवाएँ हैं, पर पहले किसी निजी क्लिनिक में पंजीकरण कराना पड़ता है।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/south-sudan/health"}
