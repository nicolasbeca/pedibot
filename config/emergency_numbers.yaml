GA: {emergency: "117 / 1300 / 011760873 / 1333", poison: null, mental: null, note: {en: "Operators may only speak French. These numbers are not always reliable.", es: "Puede que quien conteste sólo hable francés. Estos números no siempre son fiables.", fr: "Les opérateurs ne parlent parfois que français. Ces numéros ne sont pas toujours fiables.", de: "Die Mitarbeitenden sprechen möglicherweise nur Französisch. Diese Nummern sind nicht immer zuverlässig.", ru: "Операторы могут говорить только по-французски. Эти номера не всегда надёжны.", ar: "قد لا يتحدث من يرد إلا الفرنسية، وهذه الأرقام ليست موثوقة دائما.", pt: "Quem atende pode falar apenas francês. Estes números nem sempre são fiáveis.", hi: "फ़ोन उठाने वाला शायद केवल फ़्रेंच बोले। ये नंबर हमेशा भरोसेमंद नहीं होते।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/gabon/health"}
