# ── África, 18-sep-2026 ──────────────────────────────────────────────────────────────────
# El operador: «hemos dejado totalmente de lado a toda África». Medido: 4 países de 53, y los
# cuatro del norte. Aquí entran 44 más.
#
# La fuente no es la nacional de cada país, y se dice: lo intenté —seis ministerios, cinco
# 404 y un 502— y lo que sí está publicado, con dirección estable y licencia abierta, es el
# aviso de viaje del FCDO británico, que trae la sección «Emergency medical number» de cada
# país del mundo.
#
# Y trae algo que en Europa no hizo falta nunca: la letra pequeña. «No hay servicio nacional
# de ambulancias» (Nigeria), «fuera de Uagadugú, el 112» (Burkina), «puede que no contesten»
# (Mauritania). Un número que nadie coge no es un número; decirlo es la mitad del dato.
#
# En cuatro países la fuente dice que NO existe número nacional. Se publican igual, con
# `no_national: true`: callarlos sería fingir que no existen, y ponerles un 112 sería mentir.
# Fuente de todos: UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0; leído el 18-sep-2026)
AO: {emergency: "112", poison: null, mental: null, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/angola/health"}
BF: {emergency: "18 from Ouagadougou", poison: null, mental: null, note: {en: "Outside Ouagadougou, call the universal emergency number 112. If you get no response, you will need to get local advice about the closest hospital and how to get to it.", es: "Fuera de Uagadugú, marca el número universal 112. Si no responde nadie, tendrás que preguntar allí mismo cuál es el hospital más cercano y cómo llegar.", fr: "Hors de Ouagadougou, appelez le numéro universel 112. Si personne ne répond, il faudra demander sur place quel est l'hôpital le plus proche et comment y aller.", de: "Außerhalb von Ouagadougou wählen Sie die universelle Notrufnummer 112. Wenn niemand antwortet, müssen Sie vor Ort fragen, wo das nächste Krankenhaus ist und wie man hinkommt.", ru: "За пределами Уагадугу звоните по универсальному номеру 112. Если никто не ответит, спросите на месте, где ближайшая больница и как до неё добраться.", ar: "خارج واغادوغو، اتصل بالرقم العالمي 112. وإن لم يرد أحد، فاسأل في مكانك عن أقرب مستشفى وكيف تصل إليه.", pt: "Fora de Uagadugu, ligue para o número universal 112. Se ninguém responder, terá de perguntar no local qual é o hospital mais próximo e como lá chegar.", hi: "औआगादूगू के बाहर सार्वभौमिक नंबर 112 पर कॉल करें। अगर कोई जवाब न दे, तो वहीं पूछें कि निकटतम अस्पताल कौन सा है और वहाँ कैसे पहुँचें।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/burkina-faso/health"}
BI: {emergency: "112", poison: null, mental: null, note: {en: "You can also request help from the Red Cross by calling 109.", es: "También puedes pedir ayuda a la Cruz Roja llamando al 109.", fr: "Vous pouvez aussi demander de l'aide à la Croix-Rouge en appelant le 109.", de: "Sie können auch das Rote Kreuz unter 109 um Hilfe bitten.", ru: "Можно также обратиться за помощью в Красный Крест по номеру 109.", ar: "يمكنك أيضا طلب المساعدة من الصليب الأحمر على الرقم 109.", pt: "Também pode pedir ajuda à Cruz Vermelha ligando para o 109.", hi: "आप 109 पर कॉल करके रेड क्रॉस से भी मदद माँग सकते हैं।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/burundi/health"}
BJ: {emergency: "118", poison: null, mental: null, note: {en: "Outside Cotonou, there may not be an emergency response. You are likely to have to get local advice and arrange transport to the nearest medical centre.", es: "Fuera de Cotonú puede que no acuda nadie. Lo más probable es que tengas que preguntar allí mismo y organizar tú el transporte al centro médico más cercano.", fr: "Hors de Cotonou, il se peut que personne ne vienne. Vous devrez sans doute demander sur place et organiser vous-même le transport vers le centre médical le plus proche.", de: "Außerhalb von Cotonou kommt möglicherweise niemand. Wahrscheinlich müssen Sie vor Ort fragen und den Transport zum nächsten Gesundheitszentrum selbst organisieren.", ru: "За пределами Котону помощь может не приехать. Скорее всего, придётся спросить на месте и самим организовать транспорт до ближайшего медицинского центра.", ar: "خارج كوتونو قد لا يأتي أحد. الأرجح أن تسأل في مكانك وتدبر بنفسك وسيلة للوصول إلى أقرب مركز طبي.", pt: "Fora de Cotonu pode não aparecer ninguém. É provável que tenha de perguntar no local e organizar o transporte até ao centro médico mais próximo.", hi: "कोतोनू के बाहर शायद कोई न आए। संभव है कि आपको वहीं पूछना पड़े और निकटतम चिकित्सा केंद्र तक पहुँचने का इंतज़ाम खुद करना पड़े।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/benin/health"}
