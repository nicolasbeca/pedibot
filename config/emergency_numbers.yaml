SD: {emergency: "999", poison: null, mental: null, note: {en: "The source warns that emergency services in Sudan have been severely affected by the conflict and are often unresponsive. If nobody answers, go to the nearest hospital.", es: "La fuente avisa de que los servicios de urgencias de Sudán están muy afectados por el conflicto y a menudo no responden. Si no contesta nadie, ve al hospital más cercano.", fr: "La source prévient que les services d'urgence du Soudan sont très affectés par le conflit et ne répondent souvent pas. Si personne ne répond, allez à l'hôpital le plus proche.", de: "Die Quelle warnt, dass die Notdienste im Sudan durch den Konflikt stark beeinträchtigt sind und oft nicht antworten. Wenn niemand abnimmt, gehen Sie ins nächste Krankenhaus.", ru: "Источник предупреждает: экстренные службы Судана сильно пострадали от конфликта и часто не отвечают. Если никто не отвечает, идите в ближайшую больницу.", ar: "يحذر المصدر من أن خدمات الطوارئ في السودان تأثرت بشدة بالنزاع وكثيرا ما لا ترد. إن لم يرد أحد، فاذهب إلى أقرب مستشفى.", pt: "A fonte avisa que os serviços de emergência do Sudão estão muito afetados pelo conflito e muitas vezes não respondem. Se ninguém atender, vá ao hospital mais próximo.", hi: "स्रोत चेतावनी देता है कि सूडान की आपातकालीन सेवाएँ संघर्ष से बुरी तरह प्रभावित हैं और अक्सर जवाब नहीं देतीं। अगर कोई न उठाए, तो निकटतम अस्पताल जाएँ।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/sudan/health"}
