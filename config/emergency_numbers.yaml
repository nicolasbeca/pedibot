CD: {emergency: null, poison: null, mental: null, no_national: true, note: {en: "There is no general emergency medical number in the Democratic Republic of the Congo (DRC).", es: "En la República Democrática del Congo no hay un número general de urgencias médicas.", fr: "Il n'existe pas de numéro général d'urgence médicale en République démocratique du Congo.", de: "In der Demokratischen Republik Kongo gibt es keine allgemeine medizinische Notrufnummer.", ru: "В Демократической Республике Конго нет общего номера скорой медицинской помощи.", ar: "لا يوجد في جمهورية الكونغو الديمقراطية رقم عام لطوارئ الإسعاف.", pt: "Na República Democrática do Congo não existe um número geral de emergência médica.", hi: "कांगो लोकतांत्रिक गणराज्य में कोई सामान्य आपातकालीन चिकित्सा नंबर नहीं है।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/democratic-republic-of-the-congo/health"}
CF: {emergency: "610600 / 117", poison: null, mental: null, note: {en: "Emergency numbers are unreliable in the Central African Republic. The emergency services are unlikely to respond outside of Bangui.", es: "Los números de urgencias no son fiables en la República Centroafricana. Fuera de Bangui es poco probable que responda nadie.", fr: "Les numéros d'urgence ne sont pas fiables en République centrafricaine. Hors de Bangui, il est peu probable que quelqu'un réponde.", de: "Die Notrufnummern in der Zentralafrikanischen Republik sind unzuverlässig. Außerhalb von Bangui antwortet wahrscheinlich niemand.", ru: "Номера экстренных служб в Центральноафриканской Республике ненадёжны. За пределами Банги вряд ли кто-то ответит.", ar: "أرقام الطوارئ في جمهورية أفريقيا الوسطى غير موثوقة، ومن غير المرجح أن يرد أحد خارج بانغي.", pt: "Os números de emergência não são fiáveis na República Centro-Africana. Fora de Bangui é pouco provável que alguém atenda.", hi: "मध्य अफ़्रीकी गणराज्य में आपातकालीन नंबर भरोसेमंद नहीं हैं। बांगी के बाहर किसी के जवाब देने की संभावना कम है।"}, source: "UK Foreign, Commonwealth & Development Office — travel advice, «Emergency medical number» (Open Government Licence v3.0)", source_url: "https://www.gov.uk/foreign-travel-advice/central-african-republic/health"}
