# Las coletillas que el generador de la OMS añade a un nombre. Se traducen aparte porque se
# pegan a cualquiera de los de arriba, y repetirlas en cada entrada sería copiar cuarenta veces
# la misma frase y equivocarse en una.
suffixes:
  " (some regions only)":
    en: " (some regions only)"
    es: " (sólo en algunas regiones)"
    fr: " (certaines régions seulement)"
    de: " (nur in einigen Regionen)"
    ru: " (только в некоторых регионах)"
    ar: " (في بعض المناطق فقط)"
    pt: " (apenas em algumas regiões)"
    hi: " (केवल कुछ क्षेत्रों में)"

