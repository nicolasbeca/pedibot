# Los nombres de las vacunas, en las ocho lenguas del sitio (20-sep-2026).
#
# El problema que resuelve: el almacén de la OMS da los nombres en inglés, y 58 de los 66
# calendarios salen de ahí. Un padre marroquí preguntando en árabe leía «Polio, oral (OPV)» y
# «Vitamin A (a supplement, not a vaccine)» dentro de una respuesta en su idioma. Son justo los
# países a los que va dirigido esto.
#
# **La regla de la que sale todo lo demás: la SIGLA no se traduce.** BCG, OPV, IPV, MMR, DTP,
# HPV y Hib es lo que está impreso en la cartilla de papel de la madre, en Nairobi y en Sevilla,
# y es lo que le van a decir en el centro de salud. Traducir la sigla sería alejar el texto del
# papel que tiene en la mano. Lo que se traduce es lo que la explica: «oral», «inactivada»,
# «pentavalente», «un suplemento, no una vacuna», «sólo niñas».
#
# Lo que NO está aquí se queda como está, y eso es a propósito: los ocho calendarios transcritos
# a mano del documento nacional —España, Portugal, Brasil, Reino Unido, EE. UU., Francia,
# Alemania e India— usan las palabras del propio ministerio, y ésas mandan sobre cualquier
# traducción que yo pueda hacer.
#
# **Pendiente de revisión por hablantes nativos**, sobre todo el árabe y el hindi. Está en la
# partida de 15.000 $ del plan de financiación, y hasta que ocurra esto es lo mejor que hay, no
# lo definitivo. Si alguien ve un error, `pedibot.ai@gmail.com`.

