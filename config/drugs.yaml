# Dose calculator catalogue (PRD §5.3). Only over-the-counter paediatric antipyretics/analgesics.
# Ranges come from AEPap "Guía rápida de dosificación práctica en pediatría" (3.ª ed.) and are
# deliberately conservative; hard caps from the Spanish/UK/US product labels. Every row has a test.
# Brands map to the SAME two molecules; the concentration is what changes and what parents get
# wrong — so each brand lists its usual liquid strengths by country. Verify on the bottle, always.

drugs:
  paracetamol:
    generic: {en: "Paracetamol (acetaminophen)", es: "Paracetamol", fr: "Paracétamol", de: "Paracetamol", ru: "Парацетамол", ar: "باراسيتامول", pt: "Paracetamol", hi: "पैरासिटामोल"}
    aliases: [acetaminophen, acetaminofen, acetaminofén, apap, "ben-u-ron", "ben u ron", "benuron", "paracetamol-ratiopharm", "tylenol bebe", "tylenol bebê", "tylenol criança", "tylenol crianca", "panadol baby"]
    brands:
      - {name: "Apiretal", countries: [ES], forms: ["gotas 100 mg/ml"]}
      # ojo: Dalsy NO es paracetamol, es ibuprofeno. Está en su lista, más abajo.
      - {name: "Termalgin", countries: [ES], forms: ["jarabe 120 mg/5 ml"]}
      - {name: "Gelocatil", countries: [ES], forms: ["gotas 100 mg/ml", "jarabe 120 mg/5 ml"]}
      - {name: "Efferalgan", countries: [ES, FR, IT], forms: ["jarabe 150 mg/5 ml (3 %)"]}
      - {name: "Doliprane", countries: [FR], forms: ["suspensión 2,4 %  (120 mg/5 ml)"]}
      - {name: "Calpol", countries: [GB, IE], forms: ["infant 120 mg/5 ml", "six plus 250 mg/5 ml"]}
      - {name: "Tylenol Children's / Infants'", countries: [US, CA], forms: ["160 mg/5 ml"]}
      - {name: "Panadol Children", countries: [AU, NZ, GB], forms: ["baby drops 100 mg/ml", "1-5 years 120 mg/5 ml", "5-12 years 250 mg/5 ml"]}
      - {name: "Tempra / Tylenol", countries: [MX, AR, CL, CO], forms: ["gotas 100 mg/ml", "jarabe 160 mg/5 ml"]}
      - {name: "Tachipirina", countries: [IT], forms: ["jarabe 120 mg/5 ml", "gotas 100 mg/ml"]}
      - {name: "Ben-u-ron", countries: [DE, PT], forms: ["jarabe 200 mg/5 ml (4 %)"]}
      - {name: "Tylenol / Paracetamol genérico", countries: [BR], forms: ["gotas 200 mg/ml", "suspensão 160 mg/5 ml"]}
    strengths_mg_per_ml: [100, 24, 30, 32, 40, 50, 200]
    per_dose_mg_per_kg: [10, 15]
    interval_hours: [4, 6]
    max_mg_per_kg_day: 60
    max_single_mg: 1000
    max_daily_mg: 4000
    min_age_months: 0
    min_weight_kg: 0
    notes:
      en: "Under 3 months, only if a doctor has told you to. Do not combine with other products that also contain paracetamol (cold remedies)."
      es: "Menores de 3 meses: solo si lo ha indicado el pediatra. No combinar con otros productos que también lleven paracetamol (anticatarrales)."
      fr: "Avant 3 mois, uniquement sur avis médical. Ne pas associer à d'autres produits contenant du paracétamol (médicaments contre le rhume)."
      de: "Unter 3 Monaten nur, wenn eine Ärztin es angeordnet hat. Nicht mit anderen Mitteln kombinieren, die ebenfalls Paracetamol enthalten (Erkältungsmittel)."
      pt: "Menores de 3 meses: apenas se o pediatra tiver indicado. Não combinar com outros produtos que também levem paracetamol (medicamentos para a constipação)."
      hi: "3 महीने से कम उम्र में सिर्फ़ तभी जब डॉक्टर ने कहा हो। ऐसी दूसरी दवाओं के साथ न दें जिनमें भी पैरासिटामोल हो (सर्दी-ज़ुकाम की दवाएँ)।"
      ru: "До 3 месяцев — только если назначил врач. Не сочетать с другими средствами, которые тоже содержат парацетамол (препараты от простуды)."
      ar: "قبل 3 أشهر لا يُعطى إلا بوصفة طبيب. ولا يُجمع مع مستحضرات أخرى تحتوي أيضا على الباراسيتامول (أدوية الزكام)."
    source: "AEPap — Guía rápida de dosificación práctica en pediatría (3.ª ed.), tabla analgésicos/antitérmicos"

  ibuprofen:
    generic: {en: "Ibuprofen", es: "Ibuprofeno", fr: "Ibuprofène", de: "Ibuprofen", ru: "Ибупрофен", ar: "إيبوبروفين", pt: "Ibuprofeno", hi: "आइबुप्रोफेन"}
    aliases: [ibuprofeno, ibuprofène, ibuprofene, "nureflex", "nurofen junior", "advil infantil", "ibuprofeno pediatrico", "ibuprofeno pediátrico", "brufen", "ibufen", "algifor"]
    brands:
      - {name: "Dalsy", countries: [ES], forms: ["suspensión 2 % (100 mg/5 ml)", "suspensión 4 % (200 mg/5 ml)"]}
      - {name: "Junifen", countries: [ES], forms: ["2 % (100 mg/5 ml)", "4 % (200 mg/5 ml)"]}
      - {name: "Apirofeno", countries: [ES], forms: ["2 % (100 mg/5 ml)", "4 % (200 mg/5 ml)"]}
      - {name: "Nurofen for Children", countries: [GB, IE, AU, NZ, DE, IT, PT], forms: ["100 mg/5 ml"]}
      - {name: "Advil Children's / Infants'", countries: [US, CA, FR], forms: ["children 100 mg/5 ml", "infant drops 200 mg/5 ml (40 mg/ml)"]}
      - {name: "Motrin Children's / Infants'", countries: [US, CA, MX], forms: ["children 100 mg/5 ml", "infant drops 40 mg/ml"]}
      - {name: "Advil Pediátrico / Ibupirac", countries: [AR, CL, CO, MX], forms: ["2 % (100 mg/5 ml)", "4 % (200 mg/5 ml)"]}
      - {name: "Alivium", countries: [BR], forms: ["gotas 50 mg/ml", "suspensão 100 mg/5 ml"]}
    strengths_mg_per_ml: [20, 40, 50]
    per_dose_mg_per_kg: [5, 10]
    interval_hours: [6, 8]
    max_mg_per_kg_day: 30
    max_single_mg: 400
    max_daily_mg: 1200
    min_age_months: 3
    min_weight_kg: 5
    notes:
      en: "Not under 3 months or under 5 kg. Give with food. Avoid if dehydrated (vomiting/diarrhoea), with chickenpox, or with kidney problems."
      es: "No en menores de 3 meses ni de 5 kg. Con comida. Evitar si está deshidratado (vómitos/diarrea), con varicela o con problemas renales."
      fr: "Pas avant 3 mois ni en dessous de 5 kg. À prendre avec de la nourriture. À éviter en cas de déshydratation (vomissements/diarrhée), de varicelle ou de problèmes rénaux."
      de: "Nicht unter 3 Monaten und nicht unter 5 kg. Mit einer Mahlzeit geben. Vermeiden bei Austrocknung (Erbrechen/Durchfall), bei Windpocken oder bei Nierenproblemen."
      pt: "Não em menores de 3 meses nem de 5 kg. Com comida. Evitar se estiver desidratado (vómitos/diarreia), com varicela ou com problemas renais."
      hi: "3 महीने से कम या 5 किलो से कम वज़न में नहीं। खाने के साथ दें। अगर बच्चा निर्जलित हो (उल्टी/दस्त), चिकनपॉक्स हो या गुर्दे की समस्या हो तो न दें।"
      ru: "Не давать до 3 месяцев и при весе меньше 5 кг. Давать во время еды. Не давать при обезвоживании (рвота, понос), при ветрянке и при болезнях почек."
      ar: "لا يُعطى قبل 3 أشهر ولا لوزن أقل من 5 كغ. يُعطى مع الطعام. ويُتجنب عند الجفاف (قيء أو إسهال) وعند الجدري المائي وعند مشاكل الكلى."
    source: "AEPap — Guía rápida de dosificación práctica en pediatría (3.ª ed.), tabla analgésicos/antitérmicos"

# Deliberately NOT included (parents ask, guidelines say no or "doctor only"): aspirin (Reye syndrome),
# cough syrups (AEP: not under 6), antihistamines, antibiotics, codeine.
