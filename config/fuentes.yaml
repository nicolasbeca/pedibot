# ── VIS del CDC en hindi y en árabe (12-sep-2026) ─────────────────────────────────
# El primer material NATIVO en hindi del corpus. Hasta hoy el hindi tenía CERO documentos
# propios y toda respuesta cruzaba a otra lengua; el único candidato con licencia abierta
# —el manual de ASHA— resultó estar compuesto en Krutidev y no traía un solo carácter
# devanagari (L128). Comprobado antes de catalogar, uno por uno: entre 77 y 89 % del texto
# está en su escritura, de 3.270 a 5.120 caracteres por ficha.
#
# Hasta el 30-sep-2026 iban como `citar_solo`: la traducción es de Immunize.org y no
# publicaba un permiso de redistribución. Se lo pedimos y contestaron que sus materiales están
# libres de derechos, con condiciones: atribuirles a ELLOS con enlace al PDF completo, no poner
# nuestra marca sobre sus hojas y bajar siempre la versión vigente. Por eso `org` es
# Immunize.org y no el CDC. Las condiciones, citadas del correo: ops/PERMISOS.md.
  - doc_id: cdcvis_ar_dtap
    file: vis/vis_arabic_dtap.pdf
    org: Immunize.org
    org_full: Immunize.org — translation of the CDC Vaccine Information Statement
    title: بيان معلومات اللقاح — DTaP
    year: 2025
    lang: ar
    topic: vacunas
    doc_type: hoja_padres
    evidence: organismo_publico
    usage: publico
