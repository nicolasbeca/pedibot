# castellano, y el corpus es mayoritariamente español: una pregunta francesa sobre
# fiebre no alcanzaba ni una hoja del SEUP y se iba a documentos ingleses sobre
# norovirus (medido el 8-sep-2026). No es vocabulario inventado: cada entrada sale
# de buscar el concepto —su lista de términos ingleses en fr_en— en las tablas de
# las otras cinco lenguas y copiar la lista española que ya estaba escrita.
