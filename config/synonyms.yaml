  تيفوئيد: [التيفود, التيفية, حمى التيفية]
  تيفود: [التيفية]
  نحيف: [سوء التغذية, الهزال, نقص الوزن]
  هزال: [سوء التغذية]
  أرضع: [الرضاعة الطبيعية, الرضاعة]
  رضاعة: [الرضاعة الطبيعية]
  كلب: [داء الكلب, الكلاب, السعار]
  عضة: [داء الكلب, العضة]
