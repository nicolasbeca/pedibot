# Francés (fase francesa, 3-sep-2026). Dos tablas, por el mismo motivo que la de español→inglés:
#   fr      → coloquial francés → vocabulario de las fichas en francés (17 documentos: OMS + Canadá)
#   fr_en   → puente al corpus grande. Aquí NO es un recurso de última instancia como en español:
#             el francés tiene 17 documentos frente a 228, así que casi toda pregunta necesita
