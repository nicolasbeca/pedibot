  # 13-sep-2026: percentiles y curvas de crecimiento → las preguntas de la OMS y el NHS
  مئين: [percentile, centile, growth standards]
  المئين: [percentile, centile, growth standards]
  منحنى النمو: [growth chart, growth standards]
  # «احترقت يد ابني» (se quemó): el verbo en pasado no llegaba a ninguna ficha
  احترق: [burn, burns, scald]
  انحرق: [burn, burns, scald]
  # 13-sep-2026: «حرق» casaba por prefijo «حرقة» (ardor): el escozor al orinar iba a quemaduras.
  # escozor y dolor al orinar → las fichas de infección de orina
  التبول: [urinary tract infection, UTI, pee]
  حرقة: [burning, pain when peeing]
  بول: [urine, pee]
