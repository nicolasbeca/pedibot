# árabe → árabe. El padre y la OMS no siempre usan la misma palabra para la misma
# enfermedad: la ficha de tifoidea dice «التيفود» 21 veces y «التيفية» 6, y la palabra que
# escribe un padre —«التيفوئيد»— no aparece NI UNA. Sin este puente la pregunta no llegaba
# a su ficha aunque estuviera indexada (11-sep-2026).
