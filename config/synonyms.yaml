# Cross-lingual query expansion (offline). The sources are mostly Spanish and English;
# queries may come in any of the eight languages. Each entry: trigger term (lowercase,
# prefix match on a token, or substring when it contains a space) → extra search terms.
#
# `X_es` reaches the Spanish corpus (SEUP, the parent-facing backbone), `X_en` the English
# one (NHS, CDC, MedlinePlus, WHO), and `de` the RKI documents, which nothing else reaches.
# The LLM query translation in bot/retrieval.py complements this — and until 5-sep-2026 it
# was the ONLY thing that worked for de/ru/ar/pt/hi, so a failed call or a spent budget cost
# those five languages their sources while en and es kept working offline.
#
# Arabic triggers appear bare and with the article: the match is a prefix on the token, and
# "الحمى" does not start with "حمى". Hindi appears in both scripts, as its triage patterns do.
en:
  # 13-sep-2026: «it burns when he pees» iba a quemaduras
  pees: [urinary tract infection, UTI]
  peeing: [urinary tract infection, UTI]
  burns when: [urinary tract infection]
  # los temas del lote de la OMS del 11-sep: la pregunta de un padre y el título del
  # documento no usan la misma palabra («anaemic» / «anaemia», «worms» / «helminth»,
  # «bitten by a snake» / «snakebite envenoming»)
  anaemic: [anaemia, anemia, "iron deficiency"]
  worms: [helminth, deworming, "intestinal worms"]
  deworm: [helminth, "soil-transmitted"]
  snake: [snakebite, envenoming]
  bitten: [snakebite, envenoming, rabies]
