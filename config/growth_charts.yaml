  # ── África, 18-sep-2026 ──────────────────────────────────────────────────────────────────
  # Hasta hoy el continente entero tenía UN país en este fichero (Egipto). La cita para los
  # demás está en nuestro propio corpus: el cuadro de procedimientos del IMCI —el marco de la
  # OMS y UNICEF que estos países implantan— usa el peso para la edad de los estándares de la
  # OMS con el corte de −2 DE, que es el que calcula la herramienta.
  #
  # Y el rango llega hasta los 5 años y ahí se para, que es hasta donde llega la cartilla del
  # IMCI. Tenerlo puesto hasta los 19 sería prometer una comparación que esa cartilla no trae:
  # la herramienta sabe calcular el percentil de un niño de diez años en cualquier país, pero
  # aquí se dice qué lleva el carné de salud de ESE país, y el suyo se acaba a los cinco.
  #
  # `partial` y no `full` a propósito: coincide el peso para la edad, que es lo que lleva la
  # cartilla del IMCI. Decir «full» sería prometer una comparación de la talla y del IMC que no
  # he comprobado país por país.
  NG:
