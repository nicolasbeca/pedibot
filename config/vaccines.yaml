      - {age: 72, label: {en: "6 years", es: "6 años", fr: "6 ans", de: "6 Jahre", ru: "6 лет", ar: "6 سنوات", pt: "6 anos", hi: "6 साल"}, vaccines: ["Td booster (tetanus, diphtheria)"]}
      - {age: 84, label: {en: "7 years", es: "7 años", fr: "7 ans", de: "7 Jahre", ru: "7 лет", ar: "7 سنوات", pt: "7 anos", hi: "7 साल"}, vaccines: ["Td booster (tetanus, diphtheria) — 2nd dose 1 months later"]}
      - {age: 108, label: {en: "9 years", es: "9 años", fr: "9 ans", de: "9 Jahre", ru: "9 лет", ar: "9 سنوات", pt: "9 anos", hi: "9 साल"}, vaccines: ["HPV, 4-valent (girls)"]}
