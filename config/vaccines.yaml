      - {age: 6, label: {en: "6 months", es: "6 meses", fr: "6 mois", de: "6 Monate", ru: "6 месяцев", ar: "6 أشهر", pt: "6 meses", hi: "6 महीने"}, vaccines: ["BCG (tuberculosis)", "DTaP-Hib-HepB-IPV (hexavalent)", "Polio, oral (OPV)", "Pneumococcal conjugate, 13-valent", "Rotavirus, 3-dose course"]}
      - {age: 6, label: {en: "From 6 months, every year", es: "Desde los 6 meses, todos los años", fr: "À partir de 6 mois, chaque année", de: "Ab 6 Monaten, jedes Jahr", ru: "С 6 месяцев, каждый год", ar: "من عمر 6 أشهر، كل عام", pt: "A partir dos 6 meses, todos os anos", hi: "6 महीने से, हर साल"}, every_year: true, vaccines: ["Seasonal influenza"]}
      - {age: 9, label: {en: "9 months", es: "9 meses", fr: "9 mois", de: "9 Monate", ru: "9 месяцев", ar: "9 أشهر", pt: "9 meses", hi: "9 महीने"}, vaccines: ["Measles", "Meningococcal ACWY, conjugate"]}
      - {age: 12, label: {en: "12 months", es: "12 meses", fr: "12 mois", de: "12 Monate", ru: "12 месяцев", ar: "12 شهرا", pt: "12 meses", hi: "12 महीने"}, vaccines: ["MMR (measles, mumps, rubella)", "Meningococcal ACWY, conjugate", "Polio, oral (OPV)", "Pneumococcal conjugate, 13-valent"]}
      - {age: 18, label: {en: "18 months", es: "18 meses", fr: "18 mois", de: "18 Monate", ru: "18 месяцев", ar: "18 شهرا", pt: "18 meses", hi: "18 महीने"}, vaccines: ["DTaP-Hib", "Hepatitis A", "MMR (measles, mumps, rubella)", "Polio, oral (OPV)", "Varicella (chickenpox)"]}
      - {age: 24, label: {en: "2 years", es: "2 años", fr: "2 ans", de: "2 Jahre", ru: "2 года", ar: "سنتان", pt: "2 anos", hi: "2 साल"}, vaccines: ["Hepatitis A"]}
      - {age: 48, label: {en: "4–6 years", es: "4–6 años", fr: "4–6 ans", de: "4–6 Jahre", ru: "4–6 лет", ar: "4–6 سنوات", pt: "4–6 anos", hi: "4–6 साल"}, vaccines: ["DTaP (diphtheria, tetanus, pertussis)", "MMR (measles, mumps, rubella)", "Polio, oral (OPV)", "Varicella (chickenpox)"]}
      - {age: 84, label: {en: "From 7 years", es: "Desde los 7 años", fr: "À partir de 7 ans", de: "Ab 7 Jahren", ru: "С 7 лет", ar: "من عمر 7 سنوات", pt: "A partir dos 7 anos", hi: "7 साल से"}, vaccines: ["Td booster (tetanus, diphtheria)"]}
      - {age: 132, label: {en: "11–12 years", es: "11–12 años", fr: "11–12 ans", de: "11–12 Jahre", ru: "11–12 лет", ar: "11–12 سنوات", pt: "11–12 anos", hi: "11–12 साल"}, vaccines: ["HPV, 4-valent (girls)"]}
