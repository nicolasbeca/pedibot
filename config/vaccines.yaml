    source: "WHO/UNICEF — national immunization schedule as reported by São Tomé & Príncipe to WHO; WIISE public dataset AD_SCHEDULES, 2025 reporting year (consultado el 18-09-2026)"
    source_url: "https://immunizationdata.who.int/global/wiise-detail-page/vaccination-schedule-for-são-tomé-&-príncipe"
    note: {en: "This is the schedule São Tomé & Príncipe reports to WHO, published as data under WHO's open licence — not a copy of the ministry's own page. The ministry can change a date without WHO's file changing the same week, so if your health centre says something different, your health centre is right. Two products on one line are alternatives for a single injection, not two.", es: "Este es el calendario que Santo Tomé y Príncipe le reporta a la OMS, publicado como datos con la licencia abierta de la OMS; no es una copia de la página del ministerio. El ministerio puede cambiar una fecha sin que el fichero de la OMS cambie esa misma semana, así que si tu centro de salud dice otra cosa, manda tu centro de salud. Dos productos en la misma línea son alternativas para un pinchazo, no dos.", fr: "Voici le calendrier que Sao Tomé-et-Principe déclare à l'OMS, publié comme données sous la licence ouverte de l'OMS ; ce n'est pas une copie de la page du ministère. Le ministère peut changer une date sans que le fichier de l'OMS change la même semaine : si votre centre de santé dit autre chose, c'est lui qui a raison. Deux produits sur une ligne sont des alternatives pour une seule injection.", de: "Das ist der Impfkalender, den São Tomé und Príncipe der WHO meldet, veröffentlicht als Daten unter der offenen Lizenz der WHO — keine Kopie der Ministeriumsseite. Das Ministerium kann ein Datum ändern, ohne dass sich die WHO-Datei in derselben Woche ändert; sagt Ihre Gesundheitsstelle etwas anderes, gilt sie. Zwei Produkte in einer Zeile sind Alternativen für eine Impfung, nicht zwei.", ru: "Это календарь, который Сан-Томе и Принсипи сообщает ВОЗ, опубликованный как данные под открытой лицензией ВОЗ, а не копия страницы министерства. Министерство может изменить дату, а файл ВОЗ обновится не в ту же неделю; если в вашей поликлинике говорят иначе, правы они. Два препарата в одной строке — это варианты одной прививки, а не две.", ar: "هذا هو التقويم الذي تبلغ به ساو تومي وبرينسيبي منظمة الصحة العالمية، منشورا بيانات برخصة المنظمة المفتوحة، لا نسخة من صفحة الوزارة. وقد تغير الوزارة موعدا دون أن يتغير ملف المنظمة في الأسبوع نفسه، فإن قال المركز الصحي غير هذا فالقول قوله. وإذا ظهر منتجان في سطر واحد فهما بديلان لحقنة واحدة، لا حقنتان.", pt: "Este é o calendário que São Tomé e Príncipe reporta à OMS, publicado como dados sob a licença aberta da OMS; não é uma cópia da página do ministério. O ministério pode mudar uma data sem que o ficheiro da OMS mude na mesma semana; se o seu centro de saúde disser outra coisa, manda o seu centro de saúde. Dois produtos na mesma linha são alternativas para uma injeção, não duas.", hi: "यह वह अनुसूची है जो साओ टोम और प्रिंसिपे विश्व स्वास्थ्य संगठन को बताता है — WHO के खुले लाइसेंस के तहत डेटा के रूप में प्रकाशित, मंत्रालय के पन्ने की नक़ल नहीं। मंत्रालय कोई तारीख़ बदल सकता है और WHO की फ़ाइल उसी हफ़्ते न बदले; अगर आपका स्वास्थ्य केंद्र कुछ और कहे, तो वही सही है। एक ही पंक्ति में दो उत्पाद हों तो वे एक ही टीके के विकल्प हैं, दो टीके नहीं।"}
