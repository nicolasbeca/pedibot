    source_url: "https://www.dgs.pt/paginas-de-sistema/saude-de-a-a-z/programa-nacional-de-vacinacao/esquema-recomendado.aspx"
    note: {en: "MenB applies to children born from 2019 and HPV, from 2009, to boys as well. BCG and rotavirus are not in the general schedule, only for risk groups. At 6 months the DTPa dose numeral is missing from the official PDF's text layer; the sequence 1, 2, _, 4, 5 leaves only 3.", es: "MenB se aplica a los nacidos desde 2019, y el HPV, desde 2009, también a varones. BCG y rotavirus no están en el calendario general, solo para grupos de riesgo. A los 6 meses el número de dosis de DTPa no aparece en la capa de texto del PDF oficial; la secuencia 1, 2, _, 4, 5 solo admite un 3.", fr: "Le MenB s'applique aux enfants nés à partir de 2019 et le HPV, à partir de 2009, aussi aux garçons. Le BCG et le rotavirus ne sont pas au calendrier général, seulement pour les groupes à risque. À 6 mois, le numéro de dose du DTPa manque dans le PDF officiel ; la séquence 1, 2, _, 4, 5 n'admet qu'un 3.", de: "MenB gilt für ab 2019 Geborene, HPV ab 2009 auch für Jungen. BCG und Rotaviren stehen nicht im allgemeinen Kalender, nur für Risikogruppen. Bei 6 Monaten fehlt die DTPa-Dosisnummer in der Textebene des offiziellen PDFs; die Folge 1, 2, _, 4, 5 lässt nur eine 3 zu.", ru: "MenB — для рождённых с 2019 года, HPV — с 2009, в том числе для мальчиков. BCG и ротавирус не входят в общий календарь, только для групп риска. В 6 месяцев номер дозы DTPa отсутствует в текстовом слое официального PDF; последовательность 1, 2, _, 4, 5 допускает только 3.", ar: "لقاح MenB لمن ولدوا من 2019، وHPV من 2009 وللذكور أيضا. ولا يدخل BCG ولا الروتا في التقويم العام، بل لفئات الخطر فقط. وعند 6 أشهر يغيب رقم جرعة DTPa من طبقة نص الملف الرسمي؛ والتسلسل 1، 2، _، 4، 5 لا يسمح إلا بـ 3.", pt: "A MenB aplica-se aos nascidos a partir de 2019 e o HPV, a partir de 2009, também ao sexo masculino. BCG e rotavírus não estão no esquema geral, apenas para grupos de risco. Aos 6 meses o número da dose de DTPa não consta da camada de texto do PDF oficial; a sequência 1, 2, _, 4, 5 só admite um 3.", hi: "MenB 2019 से जन्मे बच्चों पर लागू है, और HPV 2009 से जन्मे बच्चों पर — लड़कों पर भी। BCG और रोटावायरस आम कैलेंडर में नहीं हैं, सिर्फ़ ज़्यादा जोखिम वाले समूहों के लिए हैं। 6 महीने पर DTPa की ख़ुराक का अंक आधिकारिक PDF की टेक्स्ट परत में नहीं है; क्रम 1, 2, _, 4, 5 में सिर्फ़ 3 ही बचता है।"}
