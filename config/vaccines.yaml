    source_url: "https://www.sanidad.gob.es/areas/promocionPrevencion/vacunaciones/calendario/home.htm"
    note: {en: "Regional calendars may add vaccines or shift ages slightly; check your community's schedule.", es: "Los calendarios autonómicos pueden añadir vacunas o ajustar edades; consulta el de tu comunidad.", fr: "Les calendriers régionaux peuvent ajouter des vaccins ou décaler légèrement les âges ; consultez celui de votre communauté autonome.", de: "Die Kalender der Regionen können Impfungen ergänzen oder Altersangaben leicht verschieben; sehen Sie im Kalender Ihrer Region nach.", ru: "Региональные календари могут добавлять прививки или немного сдвигать возраст; сверьтесь с календарём своего региона.", ar: "قد تضيف التقاويم الإقليمية لقاحات أو تزيح الأعمار قليلا؛ راجع تقويم منطقتك.", pt: "Os calendários regionais podem acrescentar vacinas ou ajustar idades; consulte o da sua região.", hi: "क्षेत्रीय कैलेंडर कुछ टीके जोड़ सकते हैं या उम्र थोड़ी आगे-पीछे कर सकते हैं; अपने क्षेत्र का कैलेंडर देख लीजिए।"}
