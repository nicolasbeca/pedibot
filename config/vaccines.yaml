      - {age: 43.2, label: {en: "3.6 years", es: "3,6 años", fr: "3,6 ans", de: "3,6 Jahre", ru: "3,6 года", ar: "3.6 سنة", pt: "3,6 anos", hi: "3.6 साल"}, vaccines: ["DTaP (diphtheria, tetanus, pertussis) or DTwP (diphtheria, tetanus, pertussis)"]}
