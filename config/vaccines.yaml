      - {age: 132, label: {en: "11–14 years", es: "11-14 años", fr: "11-14 ans", de: "11-14 Jahre", ru: "11-14 лет", ar: "11-14 سنة", pt: "11-14 anos", hi: "11–14 साल"}, vaccines: ["dTcaPolio (rappel, 11-13 ans)", "Papillomavirus HPV (2 doses à 5 mois d'écart, 11-14 ans, filles et garçons, recommandé)", "Méningocoque ACWY (11-14 ans, recommandé)"]}
  DE:
    name: {en: "Germany — STIKO Impfkalender 2026", es: "Alemania — calendario STIKO 2026", fr: "Allemagne — calendrier STIKO 2026", de: "Deutschland — STIKO-Impfkalender 2026", ru: "Германия — календарь STIKO 2026", ar: "ألمانيا — تقويم STIKO 2026", pt: "Alemanha — calendário STIKO 2026", hi: "जर्मनी — STIKO टीकाकरण कैलेंडर 2026"}
