      - {age: 24, label: {en: "2 to 15 years, every year", es: "2 a 15 años, cada año", fr: "2 à 15 ans, chaque année", de: "2 bis 15 Jahre, jedes Jahr", ru: "с 2 до 15 лет, ежегодно", ar: "من 2 إلى 15 سنة، كل عام", pt: "2 a 15 anos, todo ano", hi: "2 से 15 साल, हर साल"}, every_year: true, vaccines: ["Children's flu vaccine (nasal spray)"]}
