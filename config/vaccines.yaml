# Vaccination schedules, tabulated from official documents in FUENTES (idea 2, 26-ago-2026).
# Deterministic tool: the LLM never invents dates. Each country cites its document.
# ages in months; "every_year" = seasonal campaign. Names kept as the official source writes them.

countries:
  BR:
    name: {en: "Brazil — national schedule (PNI)", es: "Brasil — calendario nacional (PNI)", fr: "Brésil — calendrier national (PNI)", de: "Brasilien — nationaler Impfkalender (PNI)", ru: "Бразилия — национальный календарь (PNI)", ar: "البرازيل — التقويم الوطني (PNI)", pt: "Brasil — Calendário Nacional de Vacinação (PNI)", hi: "ब्राज़ील — राष्ट्रीय टीकाकरण कैलेंडर (PNI)"}
    source: "Ministério da Saúde — Calendário Nacional de Vacinação, criança (0 a 9 anos, 11 meses e 29 dias)"
    source_url: "https://www.gov.br/saude/pt-br/vacinacao/calendario"
    note: {en: "The official page prints the 1st pneumococcal dose as 20-valent and the 2nd as 10-valent, without explaining; Brazil is moving from PCV10 to PCV20. Transcribed as published — your health service decides which one your child gets.", es: "La página oficial imprime la 1.ª dosis de neumococo como 20-valente y la 2.ª como 10-valente, sin explicarlo; Brasil está pasando de PCV10 a PCV20. Transcrito tal cual se publica — quién decide cuál le toca a tu hijo es tu servicio de salud.", fr: "La page officielle imprime la 1re dose pneumococcique en 20-valent et la 2e en 10-valent, sans l'expliquer ; le Brésil passe du PCV10 au PCV20. Transcrit tel que publié — c'est votre service de santé qui décide.", de: "Die offizielle Seite nennt die 1. Pneumokokken-Dosis 20-valent und die 2. 10-valent, ohne Erklärung; Brasilien stellt von PCV10 auf PCV20 um. So übernommen, wie es veröffentlicht ist — was Ihr Kind bekommt, entscheidet Ihr Gesundheitsdienst.", ru: "На официальной странице 1-я доза пневмококковой вакцины указана как 20-валентная, а 2-я как 10-валентная, без пояснения; Бразилия переходит с PCV10 на PCV20. Переписано как опубликовано — что получит ребёнок, решает служба здравоохранения.", ar: "تطبع الصفحة الرسمية الجرعة الأولى للمكورات الرئوية بـ 20 تكافؤا والثانية بـ 10، دون تفسير؛ والبرازيل تنتقل من PCV10 إلى PCV20. منقول كما نُشر — وجهة الصحة لديك هي التي تقرر.", pt: "A página oficial imprime a 1.ª dose da pneumocócica como 20-valente e a 2.ª como 10-valente, sem explicar; o Brasil está migrando da PCV10 para a PCV20. Transcrito como está publicado — quem decide o que o seu filho recebe é o seu serviço de saúde.", hi: "आधिकारिक पन्ना न्यूमोकोकल की पहली ख़ुराक 20-वैलेंट और दूसरी 10-वैलेंट छापता है, बिना कारण बताए; ब्राज़ील PCV10 से PCV20 की ओर जा रहा है। जैसा छपा है वैसा ही उतारा गया — आपके बच्चे को कौन-सी लगेगी, यह आपकी स्वास्थ्य सेवा तय करती है।"}
    schedule:
