    source_url: "https://immunizationdata.who.int/global/wiise-detail-page/vaccination-schedule-for-kuwait"
    note: {en: "This is the schedule Kuwait reports to WHO, published as data under WHO's open licence — not a copy of the ministry's own page. The ministry can change a date without WHO's file changing the same week, so if your health centre says something different, your health centre is right. Two products on one line are alternatives for a single injection, not two. Kuwait has reported BCG at 3 months, not at birth, for more than a decade, and it records the pre-school booster at «3.6 years» — between the third and fourth birthday. Both are copied here as reported.", es: "Este es el calendario que Kuwait le reporta a la OMS, publicado como datos con la licencia abierta de la OMS; no es una copia de la página del ministerio. El ministerio puede cambiar una fecha sin que el fichero de la OMS cambie esa misma semana, así que si tu centro de salud dice otra cosa, manda tu centro de salud. Dos productos en la misma línea son alternativas para un pinchazo, no dos. Kuwait reporta la BCG a los 3 meses, no al nacer, desde hace más de diez años, y anota el refuerzo preescolar en «3,6 años» — entre el tercer y el cuarto cumpleaños. Las dos cosas van aquí tal como las reporta.", fr: "Voici le calendrier que Koweït déclare à l'OMS, publié comme données sous la licence ouverte de l'OMS ; ce n'est pas une copie de la page du ministère. Le ministère peut changer une date sans que le fichier de l'OMS change la même semaine : si votre centre de santé dit autre chose, c'est lui qui a raison. Deux produits sur une ligne sont des alternatives pour une seule injection. Le Koweït déclare le BCG à 3 mois, et non à la naissance, depuis plus de dix ans, et note le rappel préscolaire à « 3,6 ans » — entre le troisième et le quatrième anniversaire. Les deux sont repris tels quels.", de: "Das ist der Impfkalender, den Kuwait der WHO meldet, veröffentlicht als Daten unter der offenen Lizenz der WHO — keine Kopie der Ministeriumsseite. Das Ministerium kann ein Datum ändern, ohne dass sich die WHO-Datei in derselben Woche ändert; sagt Ihre Gesundheitsstelle etwas anderes, gilt sie. Zwei Produkte in einer Zeile sind Alternativen für eine Impfung, nicht zwei. Kuwait meldet BCG seit über zehn Jahren mit 3 Monaten, nicht bei der Geburt, und die Vorschul-Auffrischung mit «3,6 Jahren» — zwischen dem dritten und vierten Geburtstag. Beides steht hier so, wie es gemeldet wurde.", ru: "Это календарь, который Кувейт сообщает ВОЗ, опубликованный как данные под открытой лицензией ВОЗ, а не копия страницы министерства. Министерство может изменить дату, а файл ВОЗ обновится не в ту же неделю; если в вашей поликлинике говорят иначе, правы они. Два препарата в одной строке — это варианты одной прививки, а не две. Кувейт уже более десяти лет сообщает БЦЖ в 3 месяца, а не при рождении, а дошкольную ревакцинацию указывает как «3,6 года» — между третьим и четвёртым днём рождения. И то и другое приведено так, как сообщено.", ar: "هذا هو التقويم الذي تبلغ به الكويت منظمة الصحة العالمية، منشورا بيانات برخصة المنظمة المفتوحة، لا نسخة من صفحة الوزارة. وقد تغير الوزارة موعدا دون أن يتغير ملف المنظمة في الأسبوع نفسه، فإن قال المركز الصحي غير هذا فالقول قوله. وإذا ظهر منتجان في سطر واحد فهما بديلان لحقنة واحدة، لا حقنتان. وتبلغ الكويت عن لقاح BCG في عمر ثلاثة أشهر، لا عند الولادة، منذ أكثر من عشر سنوات، وتسجل جرعة ما قبل المدرسة عند «3.6 سنة» — أي بين عيد الميلاد الثالث والرابع. وكلاهما منقول كما ورد.", pt: "Este é o calendário que Kuwait reporta à OMS, publicado como dados sob a licença aberta da OMS; não é uma cópia da página do ministério. O ministério pode mudar uma data sem que o ficheiro da OMS mude na mesma semana; se o seu centro de saúde disser outra coisa, manda o seu centro de saúde. Dois produtos na mesma linha são alternativas para uma injeção, não duas. O Kuwait reporta a BCG aos 3 meses, não ao nascer, há mais de dez anos, e regista o reforço pré-escolar em «3,6 anos» — entre o terceiro e o quarto aniversário. Ambos vão aqui tal como são reportados.", hi: "यह वह अनुसूची है जो कुवैत विश्व स्वास्थ्य संगठन को बताता है — WHO के खुले लाइसेंस के तहत डेटा के रूप में प्रकाशित, मंत्रालय के पन्ने की नक़ल नहीं। मंत्रालय कोई तारीख़ बदल सकता है और WHO की फ़ाइल उसी हफ़्ते न बदले; अगर आपका स्वास्थ्य केंद्र कुछ और कहे, तो वही सही है। एक ही पंक्ति में दो उत्पाद हों तो वे एक ही टीके के विकल्प हैं, दो टीके नहीं। कुवैत दस साल से ज़्यादा समय से BCG को जन्म पर नहीं, 3 महीने पर बताता है, और स्कूल से पहले वाले बूस्टर को «3.6 साल» पर दर्ज करता है — तीसरे और चौथे जन्मदिन के बीच। दोनों यहाँ वैसे ही हैं जैसे बताए गए।"}
