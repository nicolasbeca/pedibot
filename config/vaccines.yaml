      - {age: 2.3, label: {en: "10 weeks", es: "10 semanas", fr: "10 semaines", de: "10 Wochen", ru: "10 недель", ar: "10 أسابيع", pt: "10 semanas", hi: "10 हफ़्ते"}, vaccines: ["DTwP-Hib-HepB (pentavalent)", "Polio, oral (OPV)", "Pneumococcal conjugate, 13-valent", "Rotavirus, 2-dose course"]}
      - {age: 3.2, label: {en: "14 weeks", es: "14 semanas", fr: "14 semaines", de: "14 Wochen", ru: "14 недель", ar: "14 أسبوعا", pt: "14 semanas", hi: "14 हफ़्ते"}, vaccines: ["DTwP-Hib-HepB (pentavalent)", "Polio, inactivated (IPV)", "Polio, oral (OPV)", "Pneumococcal conjugate, 13-valent", "Rotavirus, 2-dose course"]}
      - {age: 9, label: {en: "9 months", es: "9 meses", fr: "9 mois", de: "9 Monate", ru: "9 месяцев", ar: "9 أشهر", pt: "9 meses", hi: "9 महीने"}, vaccines: ["Polio, inactivated (IPV)", "Measles", "Meningococcal A, conjugate", "Vitamin A (a supplement, not a vaccine)"]}
      - {age: 15, label: {en: "15 months", es: "15 meses", fr: "15 mois", de: "15 Monate", ru: "15 месяцев", ar: "15 شهرا", pt: "15 meses", hi: "15 महीने"}, vaccines: ["Measles"]}
