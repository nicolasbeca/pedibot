      - {age: 6, label: {en: "6 months", es: "6 meses", fr: "6 mois", de: "6 Monate", ru: "6 месяцев", ar: "6 أشهر", pt: "6 meses", hi: "6 महीने"}, vaccines: ["DTaP-Hib-HepB-IPV (hexavalent) or DTwP-Hib-HepB (pentavalent)", "Polio, inactivated (IPV)", "Pneumococcal conjugate, 13-valent or Pneumococcal conjugate, 20-valent", "Rotavirus, 3-dose course"]}
      - {age: 6, label: {en: "From 6 months, every year", es: "Desde los 6 meses, todos los años", fr: "À partir de 6 mois, chaque année", de: "Ab 6 Monaten, jedes Jahr", ru: "С 6 месяцев, каждый год", ar: "من عمر 6 أشهر، كل عام", pt: "A partir dos 6 meses, todos os anos", hi: "6 महीने से, हर साल"}, every_year: true, vaccines: ["Seasonal influenza"]}
