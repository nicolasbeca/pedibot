      - {age: 18, label: {en: "18 months", es: "18 meses", fr: "18 mois", de: "18 Monate", ru: "18 месяцев", ar: "18 شهرا", pt: "18 meses", hi: "18 महीने"}, vaccines: ["MR (measles, rubella)", "Vitamin A (a supplement, not a vaccine)"]}
      - {age: 24, label: {en: "2 years", es: "2 años", fr: "2 ans", de: "2 Jahre", ru: "2 года", ar: "سنتان", pt: "2 anos", hi: "2 साल"}, vaccines: ["Vitamin A (a supplement, not a vaccine)"]}
      - {age: 30, label: {en: "30 months", es: "30 meses", fr: "30 mois", de: "30 Monate", ru: "30 месяцев", ar: "30 شهرا", pt: "30 meses", hi: "30 महीने"}, vaccines: ["Vitamin A (a supplement, not a vaccine)"]}
