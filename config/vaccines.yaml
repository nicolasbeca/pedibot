      - {age: 9, label: {en: "9 months", es: "9 meses", fr: "9 mois", de: "9 Monate", ru: "9 месяцев", ar: "9 أشهر", pt: "9 meses", hi: "9 महीने"}, vaccines: ["Malaria (RTS,S / R21)", "Measles", "Meningococcal A, conjugate"]}
