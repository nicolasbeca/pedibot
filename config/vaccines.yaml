# Vaccination schedules, tabulated from official documents in FUENTES (idea 2, 26-ago-2026).
# Deterministic tool: the LLM never invents dates. Each country cites its document.
# ages in months; "every_year" = seasonal campaign. Names kept as the official source writes them.

countries:
  ES:
    name: {en: "Spain — common schedule 2025", es: "España — calendario común 2025", fr: "Espagne — calendrier commun 2025", de: "Spanien — gemeinsamer Impfkalender 2025", ru: "Испания — общий календарь 2025", ar: "إسبانيا — التقويم الموحد 2025"}
    source: "Ministerio de Sanidad / Consejo Interterritorial del SNS — Calendario común de vacunación e inmunización a lo largo de toda la vida, 2025"
    source_url: "https://www.sanidad.gob.es/areas/promocionPrevencion/vacunaciones/calendario-y-coberturas/home.htm"
    note: {en: "Regional calendars may add vaccines or shift ages slightly; check your community's schedule.", es: "Los calendarios autonómicos pueden añadir vacunas o ajustar edades; consulta el de tu comunidad.", fr: "Les calendriers régionaux peuvent ajouter des vaccins ou décaler légèrement les âges ; consultez celui de votre communauté autonome.", de: "Die Kalender der Regionen können Impfungen ergänzen oder Altersangaben leicht verschieben; sehen Sie im Kalender Ihrer Region nach.", ru: "Региональные календари могут добавлять прививки или немного сдвигать возраст; сверьтесь с календарём своего региона.", ar: "قد تضيف التقاويم الإقليمية لقاحات أو تزيح الأعمار قليلا؛ راجع تقويم منطقتك."}
    schedule:
      - {age: 0, label: {en: "Birth", es: "Al nacer", fr: "À la naissance", de: "Bei der Geburt", ru: "При рождении", ar: "عند الولادة"}, vaccines: ["Hepatitis B (HB)", "VRS: nirsevimab (anticuerpo, temporada octubre-marzo)"]}
      - {age: 2, label: {en: "2 months", es: "2 meses", fr: "2 mois", de: "2 Monate", ru: "2 месяца", ar: "شهران"}, vaccines: ["Polio (VPI)", "Difteria-tétanos-tosferina (DTPa)", "Haemophilus influenzae b (Hib)", "Hepatitis B (HB)", "Neumococo (VNC)", "Meningococo B (MenB)", "Rotavirus (RV, 1.ª dosis)"]}
      - {age: 4, label: {en: "4 months", es: "4 meses", fr: "4 mois", de: "4 Monate", ru: "4 месяца", ar: "4 أشهر"}, vaccines: ["Polio (VPI)", "DTPa", "Hib", "Hepatitis B (HB)", "Neumococo (VNC)", "Meningococo B (MenB)", "Meningococo C (MenC)", "Rotavirus (RV, 2.ª dosis; 3.ª a los 6 meses según la vacuna)"]}
      - {age: 11, label: {en: "11 months", es: "11 meses", fr: "11 mois", de: "11 Monate", ru: "11 месяцев", ar: "11 شهرا"}, vaccines: ["Polio (VPI)", "DTPa", "Hib", "Hepatitis B (HB)", "Neumococo (VNC)"]}
      - {age: 12, label: {en: "12 months", es: "12 meses", fr: "12 mois", de: "12 Monate", ru: "12 месяцев", ar: "12 شهرا"}, vaccines: ["Sarampión-rubeola-parotiditis (triple vírica, TV)", "Meningococo B (MenB)", "Meningococo C (MenC)"]}
      - {age: 15, label: {en: "15 months", es: "15 meses", fr: "15 mois", de: "15 Monate", ru: "15 месяцев", ar: "15 شهرا"}, vaccines: ["Varicela (VVZ)"]}
      - {age: 6, label: {en: "6–59 months, every autumn", es: "6-59 meses, cada otoño", fr: "6-59 mois, chaque automne", de: "6-59 Monate, jeden Herbst", ru: "6-59 месяцев, каждую осень", ar: "6-59 شهرا، كل خريف"}, every_year: true, vaccines: ["Gripe estacional"]}
      - {age: 42, label: {en: "3–4 years", es: "3-4 años", fr: "3-4 ans", de: "3-4 Jahre", ru: "3-4 года", ar: "3-4 سنوات"}, vaccines: ["Triple vírica (TV, 2.ª dosis)", "Varicela (VVZ, 2.ª dosis)"]}
      - {age: 72, label: {en: "6 years", es: "6 años", fr: "6 ans", de: "6 Jahre", ru: "6 лет", ar: "6 سنوات"}, vaccines: ["DTPa", "Polio (VPI)"]}
      - {age: 144, label: {en: "12 years", es: "12 años", fr: "12 ans", de: "12 Jahre", ru: "12 лет", ar: "12 سنة"}, vaccines: ["Virus del papiloma humano (VPH)", "Meningococo ACWY (MenACWY)"]}
      - {age: 168, label: {en: "14 years", es: "14 años", fr: "14 ans", de: "14 Jahre", ru: "14 лет", ar: "14 سنة"}, vaccines: ["Tétanos-difteria (Td)"]}
  GB:
    name: {en: "United Kingdom — NHS schedule", es: "Reino Unido — calendario del NHS", fr: "Royaume-Uni — calendrier du NHS", de: "Vereinigtes Königreich — NHS-Impfkalender", ru: "Великобритания — календарь NHS", ar: "المملكة المتحدة — تقويم NHS"}
    source: "NHS — NHS vaccinations and when to have them (page last reviewed 2025)"
    source_url: "https://www.nhs.uk/conditions/vaccinations/nhs-vaccinations-and-when-to-have-them/"
    note: {en: "Some doses depend on the child's date of birth (MMRV, 6-in-1 4th dose); your GP surgery will invite you.", es: "Algunas dosis dependen de la fecha de nacimiento (MMRV, 4.ª de la 6-en-1); el centro de salud te avisa.", fr: "Certaines doses dépendent de la date de naissance de l'enfant (ROR-V, 4e dose de l'hexavalent) ; le cabinet médical vous convoque.", de: "Manche Dosen hängen vom Geburtsdatum des Kindes ab (MMRV, 4. Dosis der Sechsfachimpfung); die Hausarztpraxis lädt Sie ein.", ru: "Некоторые дозы зависят от даты рождения ребёнка (MMRV, 4-я доза шестивалентной вакцины); поликлиника пригласит вас сама.", ar: "بعض الجرعات تعتمد على تاريخ ميلاد الطفل (ROR-V، الجرعة الرابعة من السداسي)؛ والعيادة هي من يستدعيك."}
    schedule:
      - {age: 2, label: {en: "8 weeks", es: "8 semanas", fr: "8 semaines", de: "8 Wochen", ru: "8 недель", ar: "8 أسابيع"}, vaccines: ["6-in-1 vaccine (1st dose)", "Rotavirus vaccine (1st dose)", "MenB vaccine (1st dose)"]}
      - {age: 3, label: {en: "12 weeks", es: "12 semanas", fr: "12 semaines", de: "12 Wochen", ru: "12 недель", ar: "12 أسبوعا"}, vaccines: ["6-in-1 vaccine (2nd dose)", "MenB vaccine (2nd dose)", "Rotavirus vaccine (2nd dose)"]}
      - {age: 4, label: {en: "16 weeks", es: "16 semanas", fr: "16 semaines", de: "16 Wochen", ru: "16 недель", ar: "16 أسبوعا"}, vaccines: ["6-in-1 vaccine (3rd dose)", "Pneumococcal vaccine (1st dose)"]}
      - {age: 12, label: {en: "1 year", es: "1 año", fr: "1 an", de: "1 Jahr", ru: "1 год", ar: "سنة"}, vaccines: ["MMRV vaccine (1st dose, children born on or after 1 January 2025)", "Pneumococcal vaccine (2nd dose)", "MenB vaccine (3rd dose)"]}
      - {age: 18, label: {en: "18 months", es: "18 meses", fr: "18 mois", de: "18 Monate", ru: "18 месяцев", ar: "18 شهرا"}, vaccines: ["6-in-1 vaccine (4th dose, children born on or after 1 July 2024)", "MMRV vaccine (1st or 2nd dose, children born on or after 1 July 2024)"]}
      - {age: 24, label: {en: "2 to 15 years, every year", es: "2 a 15 años, cada año", fr: "2 à 15 ans, chaque année", de: "2 bis 15 Jahre, jedes Jahr", ru: "с 2 до 15 лет, ежегодно", ar: "من 2 إلى 15 سنة، كل عام"}, every_year: true, vaccines: ["Children's flu vaccine (nasal spray)"]}
      - {age: 40, label: {en: "3 years and 4 months", es: "3 años y 4 meses", fr: "3 ans et 4 mois", de: "3 Jahre und 4 Monate", ru: "3 года 4 месяца", ar: "3 سنوات و4 أشهر"}, vaccines: ["4-in-1 pre-school booster", "MMRV vaccine (1st or 2nd dose, children born 1 Sept 2022 – 31 Dec 2024)"]}
      - {age: 144, label: {en: "12 to 13 years", es: "12-13 años", fr: "12-13 ans", de: "12-13 Jahre", ru: "12-13 лет", ar: "12-13 سنة"}, vaccines: ["HPV vaccine"]}
      - {age: 168, label: {en: "14 years", es: "14 años", fr: "14 ans", de: "14 Jahre", ru: "14 лет", ar: "14 سنة"}, vaccines: ["Td/IPV (3-in-1 teenage booster)", "MenACWY vaccine"]}
  US:
    name: {en: "United States — CDC schedule 2025", es: "Estados Unidos — calendario CDC 2025", fr: "États-Unis — calendrier CDC 2025", de: "Vereinigte Staaten — CDC-Impfkalender 2025", ru: "США — календарь CDC 2025", ar: "الولايات المتحدة — تقويم CDC 2025"}
    source: "CDC — Recommended Immunizations for Birth Through 6 Years Old, United States, 2025 (easy-read)"
    source_url: "https://www.cdc.gov/vaccines/imz-schedules/child-easyread.html"
    note: {en: "Ranges are the CDC windows; your pediatrician sets the exact visit. RSV antibody depends on the mother's RSV vaccine status.", es: "Los rangos son las ventanas del CDC; tu pediatra fija la visita exacta. El anticuerpo VRS depende de si la madre se vacunó.", fr: "Les fourchettes sont les fenêtres du CDC ; c'est votre pédiatre qui fixe le rendez-vous exact. L'anticorps VRS dépend de la vaccination VRS de la mère pendant la grossesse.", de: "Die Spannen sind die Fenster der CDC; den genauen Termin legt Ihre Kinderärztin fest. Der RSV-Antikörper hängt davon ab, ob die Mutter in der Schwangerschaft geimpft wurde.", ru: "Диапазоны — это окна CDC; точную дату визита назначает ваш педиатр. Антитело против РСВ зависит от того, была ли мать привита во время беременности.", ar: "النطاقات هي نوافذ CDC؛ وطبيب طفلك هو من يحدد الموعد بالضبط. أما الجسم المضاد للفيروس المخلوي فيعتمد على تطعيم الأم أثناء الحمل."}
    schedule:
      - {age: 0, label: {en: "Birth", es: "Al nacer", fr: "À la naissance", de: "Bei der Geburt", ru: "При рождении", ar: "عند الولادة"}, vaccines: ["Hepatitis B (dose 1)", "RSV antibody (birth–7 months, depends on mother's RSV vaccine status)"]}
      - {age: 1, label: {en: "1–2 months", es: "1-2 meses", fr: "1-2 mois", de: "1-2 Monate", ru: "1-2 месяца", ar: "1-2 شهر"}, vaccines: ["Hepatitis B (dose 2)"]}
      - {age: 2, label: {en: "2 months", es: "2 meses", fr: "2 mois", de: "2 Monate", ru: "2 месяца", ar: "شهران"}, vaccines: ["Rotavirus (dose 1)", "DTaP (dose 1)", "Hib (dose 1)", "Pneumococcal (dose 1)", "Polio (dose 1)"]}
      - {age: 4, label: {en: "4 months", es: "4 meses", fr: "4 mois", de: "4 Monate", ru: "4 месяца", ar: "4 أشهر"}, vaccines: ["Rotavirus (dose 2)", "DTaP (dose 2)", "Hib (dose 2)", "Pneumococcal (dose 2)", "Polio (dose 2)"]}
      - {age: 6, label: {en: "6 months", es: "6 meses", fr: "6 mois", de: "6 Monate", ru: "6 месяцев", ar: "6 أشهر"}, vaccines: ["Rotavirus (dose 3, some brands)", "DTaP (dose 3)", "Hib (dose 3)", "Pneumococcal (dose 3)", "Polio (dose 3, 6–18 months)", "Hepatitis B (dose 3, 6–18 months)", "Influenza (every year from 6 months; two doses the first season)", "COVID-19 (from 6 months, per current guidance)"]}
      - {age: 12, label: {en: "12–15 months", es: "12-15 meses", fr: "12-15 mois", de: "12-15 Monate", ru: "12-15 месяцев", ar: "12-15 شهرا"}, vaccines: ["MMR (dose 1)", "Chickenpox/varicella (dose 1)", "Hib (dose 4)", "Pneumococcal (dose 4)", "Hepatitis A (2 doses, 6 months apart, 12–23 months)"]}
      - {age: 15, label: {en: "15–18 months", es: "15-18 meses", fr: "15-18 mois", de: "15-18 Monate", ru: "15-18 месяцев", ar: "15-18 شهرا"}, vaccines: ["DTaP (dose 4)"]}
      - {age: 48, label: {en: "4–6 years", es: "4-6 años", fr: "4-6 ans", de: "4-6 Jahre", ru: "4-6 лет", ar: "4-6 سنوات"}, vaccines: ["DTaP (dose 5)", "Polio (dose 4)", "MMR (dose 2)", "Chickenpox/varicella (dose 2)"]}
  FR:
    name: {en: "France — calendrier vaccinal 2026", es: "Francia — calendario vacunal 2026", fr: "France — calendrier vaccinal 2026", de: "Frankreich — Impfkalender 2026", ru: "Франция — календарь прививок 2026", ar: "فرنسا — تقويم التطعيم 2026"}
    source: "Santé publique France — vaccination-info-service.fr, calendrier des vaccinations 2026 (MenB et MenACWY obligatoires pour les nourrissons depuis le 1er janvier 2025)"
    source_url: "https://vaccination-info-service.fr/La-vaccination-au-cours-de-la-vie/Nourrissons-et-enfants-de-la-naissance-a-10-ans"
    note: {en: "In France 12 vaccinations are MANDATORY for infants (marked 'obligatoire'); 'recommandé' ones are advised but optional. Newborns also get RSV protection (nirsevimab) in season when the mother was not vaccinated in pregnancy.", es: "En Francia 12 vacunas son OBLIGATORIAS en lactantes (marcadas 'obligatoire'); las 'recommandé' se aconsejan pero son opcionales. Los recién nacidos reciben además protección VRS (nirsevimab) en temporada si la madre no se vacunó en el embarazo.", fr: "En France, 12 vaccinations sont OBLIGATOIRES chez le nourrisson (marquées « obligatoire ») ; celles marquées « recommandé » sont conseillées mais facultatives. Les nouveau-nés reçoivent aussi une protection contre le VRS (nirsévimab) en saison si la mère n'a pas été vaccinée pendant la grossesse.", de: "In Frankreich sind 12 Impfungen für Säuglinge PFLICHT (markiert mit „obligatoire“); die mit „recommandé“ markierten werden empfohlen, sind aber freiwillig. Neugeborene erhalten in der Saison zusätzlich einen RSV-Schutz (Nirsevimab), wenn die Mutter in der Schwangerschaft nicht geimpft wurde.", ru: "Во Франции 12 прививок для младенцев ОБЯЗАТЕЛЬНЫ (отмечены «obligatoire»); отмеченные «recommandé» рекомендуются, но необязательны. Новорождённые в сезон дополнительно получают защиту от РСВ (нирсевимаб), если мать не была привита во время беременности.", ar: "في فرنسا 12 تطعيما إلزامية للرضّع (الموسومة «obligatoire»)؛ أما الموسومة «recommandé» فموصى بها لكنها اختيارية. ويحصل حديثو الولادة في الموسم على حماية إضافية من الفيروس المخلوي (نيرسيفيماب) إذا لم تُطعّم الأم أثناء الحمل."}
    schedule:
      - {age: 2, label: {en: "2 months", es: "2 meses", fr: "2 mois", de: "2 Monate", ru: "2 месяца", ar: "شهران"}, vaccines: ["Hexavalent DTCaPolio-Hib-HepB (1re dose, obligatoire)", "Pneumocoque (1re dose, obligatoire)", "Rotavirus (1re dose, recommandé)"]}
      - {age: 3, label: {en: "3 months", es: "3 meses", fr: "3 mois", de: "3 Monate", ru: "3 месяца", ar: "3 أشهر"}, vaccines: ["Méningocoque B (1re dose, obligatoire)"]}
      - {age: 4, label: {en: "4 months", es: "4 meses", fr: "4 mois", de: "4 Monate", ru: "4 месяца", ar: "4 أشهر"}, vaccines: ["Hexavalent DTCaPolio-Hib-HepB (2e dose, obligatoire)", "Pneumocoque (2e dose, obligatoire)", "Rotavirus (dose suivante — 2 ou 3 doses selon le vaccin, recommandé)"]}
      - {age: 5, label: {en: "5 months", es: "5 meses", fr: "5 mois", de: "5 Monate", ru: "5 месяцев", ar: "5 أشهر"}, vaccines: ["Méningocoque B (2e dose, obligatoire)"]}
      - {age: 6, label: {en: "6 months", es: "6 meses", fr: "6 mois", de: "6 Monate", ru: "6 месяцев", ar: "6 أشهر"}, vaccines: ["Méningocoque ACWY (1re dose, obligatoire)"]}
      - {age: 11, label: {en: "11 months", es: "11 meses", fr: "11 mois", de: "11 Monate", ru: "11 месяцев", ar: "11 شهرا"}, vaccines: ["Hexavalent DTCaPolio-Hib-HepB (rappel, obligatoire)", "Pneumocoque (rappel, obligatoire)"]}
      - {age: 12, label: {en: "12 months", es: "12 meses", fr: "12 mois", de: "12 Monate", ru: "12 месяцев", ar: "12 شهرا"}, vaccines: ["ROR rougeole-oreillons-rubéole (1re dose, obligatoire)", "Méningocoque B (rappel, obligatoire)", "Méningocoque ACWY (rappel, obligatoire)"]}
      - {age: 16, label: {en: "16–18 months", es: "16-18 meses", fr: "16-18 mois", de: "16-18 Monate", ru: "16-18 месяцев", ar: "16-18 شهرا"}, vaccines: ["ROR (2e dose, obligatoire)"]}
      - {age: 72, label: {en: "6 years", es: "6 años", fr: "6 ans", de: "6 Jahre", ru: "6 лет", ar: "6 سنوات"}, vaccines: ["DTCaPolio (rappel)"]}
      - {age: 132, label: {en: "11–14 years", es: "11-14 años", fr: "11-14 ans", de: "11-14 Jahre", ru: "11-14 лет", ar: "11-14 سنة"}, vaccines: ["dTcaPolio (rappel, 11-13 ans)", "Papillomavirus HPV (2 doses à 5 mois d'écart, 11-14 ans, filles et garçons, recommandé)", "Méningocoque ACWY (11-14 ans, recommandé)"]}
  DE:
    name: {en: "Germany — STIKO Impfkalender 2026", es: "Alemania — calendario STIKO 2026", fr: "Allemagne — calendrier STIKO 2026", de: "Deutschland — STIKO-Impfkalender 2026", ru: "Германия — календарь STIKO 2026", ar: "ألمانيا — تقويم STIKO 2026"}
    source: "Robert Koch-Institut — Empfehlungen der Ständigen Impfkommission (STIKO) 2026, Impfkalender (Epidemiologisches Bulletin 4/2026)"
    source_url: "https://www.rki.de/DE/Themen/Infektionskrankheiten/Impfen/Impfkalender/impfkalender-node.html"
    note: {en: "Transcribed from the RKI's own English edition of the 2026 calendar. Premature babies get an extra dose of the 6-in-1 and pneumococcal at 3 months. Flu is NOT a routine childhood vaccine in Germany (risk groups only).", es: "Transcrito de la edición en inglés del propio RKI del calendario 2026. Los prematuros reciben una dosis extra de la hexavalente y del neumococo a los 3 meses. La gripe NO es vacuna infantil rutinaria en Alemania (solo grupos de riesgo).", fr: "Transcrit de l'édition anglaise du calendrier 2026 publiée par le RKI lui-même. Les prématurés reçoivent une dose supplémentaire d'hexavalent et de pneumocoque à 3 mois. La grippe n'est PAS un vaccin infantile de routine en Allemagne (groupes à risque uniquement).", de: "Abgeschrieben aus der englischen Ausgabe des Impfkalenders 2026 des RKI selbst. Frühgeborene erhalten mit 3 Monaten eine zusätzliche Dosis der Sechsfachimpfung und der Pneumokokken-Impfung. Grippe ist in Deutschland KEINE Routineimpfung für Kinder (nur Risikogruppen).", ru: "Переписано из английского издания календаря 2026 года, выпущенного самим RKI. Недоношенные дети получают дополнительную дозу шестивалентной и пневмококковой вакцины в 3 месяца. Грипп в Германии НЕ входит в рутинный детский календарь (только группы риска).", ar: "منقول عن النسخة الإنجليزية لتقويم 2026 الصادرة عن RKI نفسه. ويحصل الخدّج على جرعة إضافية من السداسي والمكورات الرئوية في الشهر الثالث. والإنفلونزا ليست تطعيما روتينيا للأطفال في ألمانيا (فئات الخطر فقط)."}
    schedule:
      - {age: 0, label: {en: "Birth (in RSV season)", es: "Al nacer (en temporada VRS)", fr: "À la naissance (en saison VRS)", de: "Bei der Geburt (in der RSV-Saison)", ru: "При рождении (в сезон РСВ)", ar: "عند الولادة (في موسم الفيروس المخلوي)"}, vaccines: ["RSV: nirsevimab/clesrovimab antibody (babies born Oct–Mar: right after birth; born Apr–Sep: the autumn before their first RSV season)"]}
      - {age: 1, label: {en: "From 6 weeks", es: "Desde las 6 semanas", fr: "À partir de 6 semaines", de: "Ab 6 Wochen", ru: "С 6 недель", ar: "من 6 أسابيع"}, vaccines: ["Rotavirus (G1; 2 or 3 doses depending on the vaccine, ≥4 weeks apart)"]}
      - {age: 2, label: {en: "2 months", es: "2 meses", fr: "2 mois", de: "2 Monate", ru: "2 месяца", ar: "شهران"}, vaccines: ["6-in-1 Tdap-Hib-IPV-HepB (G1)", "Pneumococcal (G1)", "Meningococcal B — MenB (G1)", "Rotavirus (G2)"]}
      - {age: 4, label: {en: "4 months", es: "4 meses", fr: "4 mois", de: "4 Monate", ru: "4 месяца", ar: "4 أشهر"}, vaccines: ["6-in-1 Tdap-Hib-IPV-HepB (G2)", "Pneumococcal (G2)", "MenB (G2)", "Rotavirus (G3, some vaccines)"]}
      - {age: 11, label: {en: "11 months", es: "11 meses", fr: "11 mois", de: "11 Monate", ru: "11 месяцев", ar: "11 شهرا"}, vaccines: ["6-in-1 Tdap-Hib-IPV-HepB (G3)", "Pneumococcal (G3)", "Measles-mumps-rubella MMR (G1)", "Varicella (G1)"]}
      - {age: 12, label: {en: "12 months", es: "12 meses", fr: "12 mois", de: "12 Monate", ru: "12 месяцев", ar: "12 شهرا"}, vaccines: ["MenB (G3)"]}
      - {age: 15, label: {en: "15 months", es: "15 meses", fr: "15 mois", de: "15 Monate", ru: "15 месяцев", ar: "15 شهرا"}, vaccines: ["MMR (G2)", "Varicella (G2)"]}
      - {age: 66, label: {en: "5–6 years", es: "5-6 años", fr: "5-6 ans", de: "5-6 Jahre", ru: "5-6 лет", ar: "5-6 سنوات"}, vaccines: ["Tdap booster (A1)"]}
      - {age: 108, label: {en: "9–14 years", es: "9-14 años", fr: "9-14 ans", de: "9-14 Jahre", ru: "9-14 лет", ar: "9-14 سنة"}, vaccines: ["HPV (G1+G2, ≥5 months apart; 3 doses if started at ≥15 years)", "Tdap booster (A2)", "Polio booster (A1)"]}
      - {age: 144, label: {en: "12–14 years", es: "12-14 años", fr: "12-14 ans", de: "12-14 Jahre", ru: "12-14 лет", ar: "12-14 سنة"}, vaccines: ["Meningococcal ACWY (G1) — new in the 2026 calendar, replacing the old MenC dose at 12 months"]}
