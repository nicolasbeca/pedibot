  EG:
    name: {en: "Egypt — national schedule (2025)", es: "Egipto — calendario nacional (2025)", fr: "Égypte — calendrier national (2025)", de: "Ägypten — nationaler Impfkalender (2025)", ru: "Египет — национальный календарь (2025)", ar: "مصر — التقويم الوطني (2025)", pt: "Egito — calendário nacional (2025)", hi: "मिस्र — राष्ट्रीय टीकाकरण अनुसूची (2025)"}
