      - {age: 3.2, label: {en: "14 weeks", es: "14 semanas", fr: "14 semaines", de: "14 Wochen", ru: "14 недель", ar: "14 أسبوعا", pt: "14 semanas", hi: "14 हफ़्ते"}, vaccines: ["DTwP-Hib-HepB (pentavalent)", "Polio, inactivated (IPV)", "Polio, oral (OPV)"]}
      - {age: 9, label: {en: "9 months", es: "9 meses", fr: "9 mois", de: "9 Monate", ru: "9 месяцев", ar: "9 أشهر", pt: "9 meses", hi: "9 महीने"}, vaccines: ["Measles"]}
