      - {age: 108, label: {en: "9 years", es: "9 años", fr: "9 ans", de: "9 Jahre", ru: "9 лет", ar: "9 سنوات", pt: "9 anos", hi: "9 साल"}, vaccines: ["HPV4 (1 dose)"]}
  PT:
    name: {en: "Portugal — national schedule (PNV 2025)", es: "Portugal — calendario nacional (PNV 2025)", fr: "Portugal — calendrier national (PNV 2025)", de: "Portugal — nationaler Impfkalender (PNV 2025)", ru: "Португалия — национальный календарь (PNV 2025)", ar: "البرتغال — التقويم الوطني (PNV 2025)", pt: "Portugal — Programa Nacional de Vacinação (PNV 2025)", hi: "पुर्तगाल — राष्ट्रीय टीकाकरण कार्यक्रम (PNV 2025)"}
    source: "Direção-Geral da Saúde — Livro Azul de Vacinas, Parte 1: Programa Nacional de Vacinação, esquema geral recomendado (PNV 2025; substitui o PNV 2020 a partir de outubro de 2025; consultado el 7-sep-2026)"
    source_url: "https://www.dgs.pt/publicacoes/livro-azul-de-vacinas-programa-nacional-de-vacinacao-e-outras-estrategias-de-imunizacao.aspx"
    note: {en: "The PNV 2025 replaced the 2020 one in October 2025: pneumococcal Pn13 became Pn20 (2, 4 and 12 months), and MenC at 12 months became MenACWY. MenB applies to children born from 2019 and HPV, from 2009, to boys as well. BCG and rotavirus are not in the general schedule, only for risk groups.", es: "El PNV 2025 sustituyó al de 2020 en octubre de 2025: el neumococo Pn13 pasó a Pn20 (2, 4 y 12 meses) y el MenC de los 12 meses pasó a MenACWY. MenB se aplica a los nacidos desde 2019, y el VPH, desde 2009, también a varones. BCG y rotavirus no están en el calendario general, solo para grupos de riesgo.", fr: "Le PNV 2025 a remplacé celui de 2020 en octobre 2025 : le pneumocoque Pn13 est devenu Pn20 (2, 4 et 12 mois) et le MenC de 12 mois est devenu MenACWY. Le MenB s'applique aux enfants nés à partir de 2019 et le HPV, à partir de 2009, aussi aux garçons. Le BCG et le rotavirus ne sont pas au calendrier général, seulement pour les groupes à risque.", de: "Der PNV 2025 hat den von 2020 im Oktober 2025 abgelöst: Pneumokokken Pn13 wurde zu Pn20 (2, 4 und 12 Monate), und MenC mit 12 Monaten wurde zu MenACWY. MenB gilt für ab 2019 Geborene, HPV ab 2009 auch für Jungen. BCG und Rotaviren stehen nicht im allgemeinen Kalender, nur für Risikogruppen.", ru: "PNV 2025 заменил календарь 2020 года в октябре 2025-го: пневмококковая Pn13 стала Pn20 (2, 4 и 12 месяцев), а MenC в 12 месяцев — MenACWY. MenB — для рождённых с 2019 года, HPV — с 2009, в том числе для мальчиков. BCG и ротавирус не входят в общий календарь, только для групп риска.", ar: "حل تقويم PNV 2025 محل تقويم 2020 في أكتوبر 2025: صار لقاح المكورات الرئوية Pn20 بدل Pn13 (في 2 و4 و12 شهرا)، وصار MenACWY بدل MenC عند 12 شهرا. ولقاح MenB لمن ولدوا من 2019، وHPV من 2009 وللذكور أيضا. ولا يدخل BCG ولا الروتا في التقويم العام، بل لفئات الخطر فقط.", pt: "O PNV 2025 substituiu o de 2020 em outubro de 2025: a pneumocócica Pn13 passou a Pn20 (2, 4 e 12 meses) e a MenC dos 12 meses passou a MenACWY. A MenB aplica-se aos nascidos a partir de 2019 e o HPV, a partir de 2009, também ao sexo masculino. BCG e rotavírus não estão no esquema geral, apenas para grupos de risco.", hi: "PNV 2025 ने अक्तूबर 2025 में 2020 वाले की जगह ली: न्यूमोकोकल Pn13 अब Pn20 है (2, 4 और 12 महीने), और 12 महीने पर MenC की जगह MenACWY है। MenB 2019 से जन्मे बच्चों पर लागू है, और HPV 2009 से जन्मे बच्चों पर — लड़कों पर भी। BCG और रोटावायरस आम कैलेंडर में नहीं हैं, सिर्फ़ ज़्यादा जोखिम वाले समूहों के लिए हैं।"}
