      - {age: 2, label: {en: "2 months", es: "2 meses", fr: "2 mois", de: "2 Monate", ru: "2 месяца", ar: "شهران", pt: "2 meses", hi: "2 महीने"}, vaccines: ["DTaP-Hib-HepB-IPV (hexavalent) or DTwP-Hib-HepB (pentavalent)", "Polio, inactivated (IPV)", "Pneumococcal conjugate, 13-valent or Pneumococcal conjugate, 20-valent", "Rotavirus, 3-dose course"]}
