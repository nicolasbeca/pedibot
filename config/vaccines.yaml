      - {age: 2.3, label: {en: "10 weeks", es: "10 semanas", fr: "10 semaines", de: "10 Wochen", ru: "10 недель", ar: "10 أسابيع", pt: "10 semanas", hi: "10 हफ़्ते"}, vaccines: ["DTwP-Hib-HepB (pentavalent)", "Polio, oral (OPV)", "Pneumococcal conjugate, 10-valent", "Rotavirus, 3-dose course"]}
      - {age: 3.2, label: {en: "14 weeks", es: "14 semanas", fr: "14 semaines", de: "14 Wochen", ru: "14 недель", ar: "14 أسبوعا", pt: "14 semanas", hi: "14 हफ़्ते"}, vaccines: ["DTwP-Hib-HepB (pentavalent)", "Polio, inactivated (IPV)", "Polio, oral (OPV)", "Pneumococcal conjugate, 10-valent", "Rotavirus, 3-dose course"]}
      - {age: 9, label: {en: "9 months", es: "9 meses", fr: "9 mois", de: "9 Monate", ru: "9 месяцев", ar: "9 أشهر", pt: "9 meses", hi: "9 महीने"}, vaccines: ["MR (measles, rubella)"]}
      - {age: 18, label: {en: "18 months", es: "18 meses", fr: "18 mois", de: "18 Monate", ru: "18 месяцев", ar: "18 شهرا", pt: "18 meses", hi: "18 महीने"}, vaccines: ["MR (measles, rubella)"]}
      - {age: 120, label: {en: "10 years", es: "10 años", fr: "10 ans", de: "10 Jahre", ru: "10 лет", ar: "10 سنوات", pt: "10 anos", hi: "10 साल"}, vaccines: ["HPV, 4-valent (girls)"]}
      - {age: 180, label: {en: "15–49 years", es: "15–49 años", fr: "15–49 ans", de: "15–49 Jahre", ru: "15–49 лет", ar: "15–49 سنوات", pt: "15–49 anos", hi: "15–49 साल"}, vaccines: ["Td booster (tetanus, diphtheria) — 2nd dose 1 months later"]}
