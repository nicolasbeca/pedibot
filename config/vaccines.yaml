  ES:
    name: {en: "Spain — common schedule 2026", es: "España — calendario común 2026", fr: "Espagne — calendrier commun 2026", de: "Spanien — gemeinsamer Impfkalender 2026", ru: "Испания — общий календарь 2026", ar: "إسبانيا — التقويم الموحد 2026", pt: "Espanha — calendário comum 2026", hi: "स्पेन — साझा कैलेंडर 2026"}
