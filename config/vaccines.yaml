      - {age: 18, label: {en: "18 months", es: "18 meses", fr: "18 mois", de: "18 Monate", ru: "18 месяцев", ar: "18 شهرا", pt: "18 meses", hi: "18 महीने"}, vaccines: ["DTaP-Hib-HepB-IPV (hexavalent) or DTwP-Hib-HepB (pentavalent)", "Polio, oral (OPV)", "Pneumococcal conjugate, 13-valent or Pneumococcal conjugate, 20-valent"]}
