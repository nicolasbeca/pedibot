    note: {en: "Some doses depend on the child's date of birth (MMRV, 6-in-1 4th dose); your GP surgery will invite you.", es: "Algunas dosis dependen de la fecha de nacimiento (MMRV, 4.ª de la 6-en-1); el centro de salud te avisa.", fr: "Certaines doses dépendent de la date de naissance de l'enfant (ROR-V, 4e dose de l'hexavalent) ; le cabinet médical vous convoque.", de: "Manche Dosen hängen vom Geburtsdatum des Kindes ab (MMRV, 4. Dosis der Sechsfachimpfung); die Hausarztpraxis lädt Sie ein.", ru: "Некоторые дозы зависят от даты рождения ребёнка (MMRV, 4-я доза шестивалентной вакцины); поликлиника пригласит вас сама.", ar: "بعض الجرعات تعتمد على تاريخ ميلاد الطفل (ROR-V، الجرعة الرابعة من السداسي)؛ والعيادة هي من يستدعيك.", pt: "Algumas doses dependem da data de nascimento (MMRV, 4.ª da 6-em-1); a unidade de saúde avisa.", hi: "कुछ ख़ुराकें बच्चे की जन्मतिथि पर निर्भर करती हैं (MMRV, 6-in-1 की चौथी ख़ुराक); आपका जीपी क्लिनिक आपको बुला लेगा।"}
