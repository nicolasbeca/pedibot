      - {age: 2, label: {en: "2 months", es: "2 meses", fr: "2 mois", de: "2 Monate", ru: "2 месяца", ar: "شهران", pt: "2 meses", hi: "2 महीने"}, vaccines: ["Penta: DTP+Hib+HB (1.ª dose)", "Poliomielite inativada VIP (1.ª dose)", "Rotavírus humano (1.ª dose)", "Pneumocócica 20-valente (1.ª dose)"]}
      - {age: 3, label: {en: "3 months", es: "3 meses", fr: "3 mois", de: "3 Monate", ru: "3 месяца", ar: "3 أشهر", pt: "3 meses", hi: "3 महीने"}, vaccines: ["Meningocócica C (1.ª dose)"]}
      - {age: 4, label: {en: "4 months", es: "4 meses", fr: "4 mois", de: "4 Monate", ru: "4 месяца", ar: "4 أشهر", pt: "4 meses", hi: "4 महीने"}, vaccines: ["Penta: DTP+Hib+HB (2.ª dose)", "Poliomielite inativada VIP (2.ª dose)", "Rotavírus humano (2.ª dose)", "Pneumocócica 10-valente (2.ª dose)"]}
      - {age: 5, label: {en: "5 months", es: "5 meses", fr: "5 mois", de: "5 Monate", ru: "5 месяцев", ar: "5 أشهر", pt: "5 meses", hi: "5 महीने"}, vaccines: ["Meningocócica C (2.ª dose)"]}
      - {age: 6, label: {en: "6 months", es: "6 meses", fr: "6 mois", de: "6 Monate", ru: "6 месяцев", ar: "6 أشهر", pt: "6 meses", hi: "6 महीने"}, vaccines: ["Penta: DTP+Hib+HB (3.ª dose)", "Poliomielite inativada VIP (3.ª dose)", "Influenza trivalente (1.ª dose)", "Covid-19 (1.ª dose)"]}
      - {age: 9, label: {en: "9 months", es: "9 meses", fr: "9 mois", de: "9 Monate", ru: "9 месяцев", ar: "9 أشهر", pt: "9 meses", hi: "9 महीने"}, vaccines: ["Febre amarela (1.ª dose)", "Covid-19 (3.ª dose)"]}
      - {age: 12, label: {en: "12 months", es: "12 meses", fr: "12 mois", de: "12 Monate", ru: "12 месяцев", ar: "12 شهرا", pt: "12 meses", hi: "12 महीने"}, vaccines: ["Pneumocócica 20-valente (reforço)", "Meningocócica ACWY (1 dose)", "Tríplice viral SCR (1 dose)"]}
      - {age: 15, label: {en: "15 months", es: "15 meses", fr: "15 mois", de: "15 Monate", ru: "15 месяцев", ar: "15 شهرا", pt: "15 meses", hi: "15 महीने"}, vaccines: ["DTP (1.º reforço)", "Poliomielite inativada VIP (1.º reforço)", "Tríplice viral SCR (2.ª dose)", "Varicela (1.ª dose)", "Hepatite A (1 dose)"]}
      - {age: 48, label: {en: "4 years", es: "4 años", fr: "4 ans", de: "4 Jahre", ru: "4 года", ar: "4 سنوات", pt: "4 anos", hi: "4 साल"}, vaccines: ["DTP (2.º reforço)", "Poliomielite inativada VIP (2.º reforço)", "Varicela (2.ª dose)", "Febre amarela (reforço)"]}
