  PT:
    name: {en: "Portugal — national schedule (PNV 2020)", es: "Portugal — calendario nacional (PNV 2020)", fr: "Portugal — calendrier national (PNV 2020)", de: "Portugal — nationaler Impfkalender (PNV 2020)", ru: "Португалия — национальный календарь (PNV 2020)", ar: "البرتغال — التقويم الوطني (PNV 2020)", pt: "Portugal — Programa Nacional de Vacinação (PNV 2020)", hi: "पुर्तगाल — राष्ट्रीय टीकाकरण कार्यक्रम (PNV 2020)"}
