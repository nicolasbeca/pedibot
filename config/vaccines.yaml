  US:
    name: {en: "United States — CDC schedule 2025", es: "Estados Unidos — calendario CDC 2025", fr: "États-Unis — calendrier CDC 2025", de: "Vereinigte Staaten — CDC-Impfkalender 2025", ru: "США — календарь CDC 2025", ar: "الولايات المتحدة — تقويم CDC 2025", pt: "Estados Unidos — calendário do CDC 2025", hi: "संयुक्त राज्य अमेरिका — CDC कैलेंडर 2025"}
    source: "CDC — Recommended Immunizations for Birth Through 6 Years Old, United States, 2025 (easy-read)"
    source_url: "https://www.cdc.gov/vaccines/imz-schedules/child-easyread.html"
    note: {en: "Ranges are the CDC windows; your pediatrician sets the exact visit. RSV antibody depends on the mother's RSV vaccine status.", es: "Los rangos son las ventanas del CDC; tu pediatra fija la visita exacta. El anticuerpo VRS depende de si la madre se vacunó.", fr: "Les fourchettes sont les fenêtres du CDC ; c'est votre pédiatre qui fixe le rendez-vous exact. L'anticorps VRS dépend de la vaccination VRS de la mère pendant la grossesse.", de: "Die Spannen sind die Fenster der CDC; den genauen Termin legt Ihre Kinderärztin fest. Der RSV-Antikörper hängt davon ab, ob die Mutter in der Schwangerschaft geimpft wurde.", ru: "Диапазоны — это окна CDC; точную дату визита назначает ваш педиатр. Антитело против РСВ зависит от того, была ли мать привита во время беременности.", ar: "النطاقات هي نوافذ CDC؛ وطبيب طفلك هو من يحدد الموعد بالضبط. أما الجسم المضاد للفيروس المخلوي فيعتمد على تطعيم الأم أثناء الحمل.", pt: "As faixas são as janelas do CDC; o seu pediatra marca a consulta exata. O anticorpo do VSR depende de a mãe ter se vacinado.", hi: "जो अवधि दी है वह CDC की खिड़की है; ठीक कौन-से दिन जाना है यह आपके बाल रोग विशेषज्ञ तय करते हैं। RSV एंटीबॉडी इस बात पर निर्भर करती है कि माँ को RSV का टीका लगा था या नहीं।"}
    schedule:
      - {age: 0, label: {en: "Birth", es: "Al nacer", fr: "À la naissance", de: "Bei der Geburt", ru: "При рождении", ar: "عند الولادة", pt: "Ao nascer", hi: "जन्म"}, vaccines: ["Hepatitis B (dose 1)", "RSV antibody (birth–7 months, depends on mother's RSV vaccine status)"]}
      - {age: 1, label: {en: "1–2 months", es: "1-2 meses", fr: "1-2 mois", de: "1-2 Monate", ru: "1-2 месяца", ar: "1-2 شهر", pt: "1-2 meses", hi: "1–2 महीने"}, vaccines: ["Hepatitis B (dose 2)"]}
      - {age: 2, label: {en: "2 months", es: "2 meses", fr: "2 mois", de: "2 Monate", ru: "2 месяца", ar: "شهران", pt: "2 meses", hi: "2 महीने"}, vaccines: ["Rotavirus (dose 1)", "DTaP (dose 1)", "Hib (dose 1)", "Pneumococcal (dose 1)", "Polio (dose 1)"]}
      - {age: 4, label: {en: "4 months", es: "4 meses", fr: "4 mois", de: "4 Monate", ru: "4 месяца", ar: "4 أشهر", pt: "4 meses", hi: "4 महीने"}, vaccines: ["Rotavirus (dose 2)", "DTaP (dose 2)", "Hib (dose 2)", "Pneumococcal (dose 2)", "Polio (dose 2)"]}
      - {age: 6, label: {en: "6 months", es: "6 meses", fr: "6 mois", de: "6 Monate", ru: "6 месяцев", ar: "6 أشهر", pt: "6 meses", hi: "6 महीने"}, vaccines: ["Rotavirus (dose 3, some brands)", "DTaP (dose 3)", "Hib (dose 3)", "Pneumococcal (dose 3)", "Polio (dose 3, 6–18 months)", "Hepatitis B (dose 3, 6–18 months)", "Influenza (every year from 6 months; two doses the first season)", "COVID-19 (from 6 months, per current guidance)"]}
      - {age: 12, label: {en: "12–15 months", es: "12-15 meses", fr: "12-15 mois", de: "12-15 Monate", ru: "12-15 месяцев", ar: "12-15 شهرا", pt: "12-15 meses", hi: "12–15 महीने"}, vaccines: ["MMR (dose 1)", "Chickenpox/varicella (dose 1)", "Hib (dose 4)", "Pneumococcal (dose 4)", "Hepatitis A (2 doses, 6 months apart, 12–23 months)"]}
      - {age: 15, label: {en: "15–18 months", es: "15-18 meses", fr: "15-18 mois", de: "15-18 Monate", ru: "15-18 месяцев", ar: "15-18 شهرا", pt: "15-18 meses", hi: "15–18 महीने"}, vaccines: ["DTaP (dose 4)"]}
      - {age: 48, label: {en: "4–6 years", es: "4-6 años", fr: "4-6 ans", de: "4-6 Jahre", ru: "4-6 лет", ar: "4-6 سنوات", pt: "4-6 anos", hi: "4–6 साल"}, vaccines: ["DTaP (dose 5)", "Polio (dose 4)", "MMR (dose 2)", "Chickenpox/varicella (dose 2)"]}
  FR:
    name: {en: "France — calendrier vaccinal 2026", es: "Francia — calendario vacunal 2026", fr: "France — calendrier vaccinal 2026", de: "Frankreich — Impfkalender 2026", ru: "Франция — календарь прививок 2026", ar: "فرنسا — تقويم التطعيم 2026", pt: "França — calendário vacinal 2026", hi: "फ़्रांस — टीकाकरण कैलेंडर 2026"}
    source: "Santé publique France — vaccination-info-service.fr, calendrier des vaccinations 2026 (MenB et MenACWY obligatoires pour les nourrissons depuis le 1er janvier 2025)"
    source_url: "https://vaccination-info-service.fr/La-vaccination-au-cours-de-la-vie/Nourrissons-et-enfants-de-la-naissance-a-10-ans"
    note: {en: "In France 12 vaccinations are MANDATORY for infants (marked 'obligatoire'); 'recommandé' ones are advised but optional. Newborns also get RSV protection (nirsevimab) in season when the mother was not vaccinated in pregnancy.", es: "En Francia 12 vacunas son OBLIGATORIAS en lactantes (marcadas 'obligatoire'); las 'recommandé' se aconsejan pero son opcionales. Los recién nacidos reciben además protección VRS (nirsevimab) en temporada si la madre no se vacunó en el embarazo.", fr: "En France, 12 vaccinations sont OBLIGATOIRES chez le nourrisson (marquées « obligatoire ») ; celles marquées « recommandé » sont conseillées mais facultatives. Les nouveau-nés reçoivent aussi une protection contre le VRS (nirsévimab) en saison si la mère n'a pas été vaccinée pendant la grossesse.", de: "In Frankreich sind 12 Impfungen für Säuglinge PFLICHT (markiert mit „obligatoire“); die mit „recommandé“ markierten werden empfohlen, sind aber freiwillig. Neugeborene erhalten in der Saison zusätzlich einen RSV-Schutz (Nirsevimab), wenn die Mutter in der Schwangerschaft nicht geimpft wurde.", ru: "Во Франции 12 прививок для младенцев ОБЯЗАТЕЛЬНЫ (отмечены «obligatoire»); отмеченные «recommandé» рекомендуются, но необязательны. Новорождённые в сезон дополнительно получают защиту от РСВ (нирсевимаб), если мать не была привита во время беременности.", ar: "في فرنسا 12 تطعيما إلزامية للرضّع (الموسومة «obligatoire»)؛ أما الموسومة «recommandé» فموصى بها لكنها اختيارية. ويحصل حديثو الولادة في الموسم على حماية إضافية من الفيروس المخلوي (نيرسيفيماب) إذا لم تُطعّم الأم أثناء الحمل.", pt: "Na França 12 vacinas são OBRIGATÓRIAS em lactentes (marcadas 'obligatoire'); as 'recommandé' são aconselhadas mas opcionais. Os recém-nascidos recebem ainda proteção contra o VSR (nirsevimabe) na temporada, se a mãe não se vacinou na gravidez.", hi: "फ़्रांस में शिशुओं के लिए 12 टीके अनिवार्य हैं (जिन पर 'obligatoire' लिखा है); जिन पर 'recommandé' लिखा है वे सुझाए गए हैं पर ज़रूरी नहीं। मौसम में नवजातों को RSV से बचाव (nirsevimab) भी मिलता है, अगर गर्भावस्था में माँ को टीका न लगा हो।"}
    schedule:
      - {age: 2, label: {en: "2 months", es: "2 meses", fr: "2 mois", de: "2 Monate", ru: "2 месяца", ar: "شهران", pt: "2 meses", hi: "2 महीने"}, vaccines: ["Hexavalent DTCaPolio-Hib-HepB (1re dose, obligatoire)", "Pneumocoque (1re dose, obligatoire)", "Rotavirus (1re dose, recommandé)"]}
      - {age: 3, label: {en: "3 months", es: "3 meses", fr: "3 mois", de: "3 Monate", ru: "3 месяца", ar: "3 أشهر", pt: "3 meses", hi: "3 महीने"}, vaccines: ["Méningocoque B (1re dose, obligatoire)"]}
      - {age: 4, label: {en: "4 months", es: "4 meses", fr: "4 mois", de: "4 Monate", ru: "4 месяца", ar: "4 أشهر", pt: "4 meses", hi: "4 महीने"}, vaccines: ["Hexavalent DTCaPolio-Hib-HepB (2e dose, obligatoire)", "Pneumocoque (2e dose, obligatoire)", "Rotavirus (dose suivante — 2 ou 3 doses selon le vaccin, recommandé)"]}
      - {age: 5, label: {en: "5 months", es: "5 meses", fr: "5 mois", de: "5 Monate", ru: "5 месяцев", ar: "5 أشهر", pt: "5 meses", hi: "5 महीने"}, vaccines: ["Méningocoque B (2e dose, obligatoire)"]}
      - {age: 6, label: {en: "6 months", es: "6 meses", fr: "6 mois", de: "6 Monate", ru: "6 месяцев", ar: "6 أشهر", pt: "6 meses", hi: "6 महीने"}, vaccines: ["Méningocoque ACWY (1re dose, obligatoire)"]}
      - {age: 11, label: {en: "11 months", es: "11 meses", fr: "11 mois", de: "11 Monate", ru: "11 месяцев", ar: "11 شهرا", pt: "11 meses", hi: "11 महीने"}, vaccines: ["Hexavalent DTCaPolio-Hib-HepB (rappel, obligatoire)", "Pneumocoque (rappel, obligatoire)"]}
      - {age: 12, label: {en: "12 months", es: "12 meses", fr: "12 mois", de: "12 Monate", ru: "12 месяцев", ar: "12 شهرا", pt: "12 meses", hi: "12 महीने"}, vaccines: ["ROR rougeole-oreillons-rubéole (1re dose, obligatoire)", "Méningocoque B (rappel, obligatoire)", "Méningocoque ACWY (rappel, obligatoire)"]}
      - {age: 16, label: {en: "16–18 months", es: "16-18 meses", fr: "16-18 mois", de: "16-18 Monate", ru: "16-18 месяцев", ar: "16-18 شهرا", pt: "16-18 meses", hi: "16–18 महीने"}, vaccines: ["ROR (2e dose, obligatoire)"]}
      - {age: 72, label: {en: "6 years", es: "6 años", fr: "6 ans", de: "6 Jahre", ru: "6 лет", ar: "6 سنوات", pt: "6 anos", hi: "6 साल"}, vaccines: ["DTCaPolio (rappel)"]}
      - {age: 132, label: {en: "11–14 years", es: "11-14 años", fr: "11-14 ans", de: "11-14 Jahre", ru: "11-14 лет", ar: "11-14 سنة", pt: "11-14 anos", hi: "11–14 साल"}, vaccines: ["dTcaPolio (rappel, 11-13 ans)", "Papillomavirus HPV (2 doses à 5 mois d'écart, 11-14 ans, filles et garçons, recommandé)", "Méningocoque ACWY (11-14 ans, recommandé)"]}
  DE:
    name: {en: "Germany — STIKO Impfkalender 2026", es: "Alemania — calendario STIKO 2026", fr: "Allemagne — calendrier STIKO 2026", de: "Deutschland — STIKO-Impfkalender 2026", ru: "Германия — календарь STIKO 2026", ar: "ألمانيا — تقويم STIKO 2026", pt: "Alemanha — calendário STIKO 2026", hi: "जर्मनी — STIKO टीकाकरण कैलेंडर 2026"}
    source: "Robert Koch-Institut — Empfehlungen der Ständigen Impfkommission (STIKO) 2026, Impfkalender (Epidemiologisches Bulletin 4/2026)"
    source_url: "https://www.rki.de/DE/Themen/Infektionskrankheiten/Impfen/Impfkalender/impfkalender-node.html"
    note: {en: "Transcribed from the RKI's own English edition of the 2026 calendar. Premature babies get an extra dose of the 6-in-1 and pneumococcal at 3 months. Flu is NOT a routine childhood vaccine in Germany (risk groups only).", es: "Transcrito de la edición en inglés del propio RKI del calendario 2026. Los prematuros reciben una dosis extra de la hexavalente y del neumococo a los 3 meses. La gripe NO es vacuna infantil rutinaria en Alemania (solo grupos de riesgo).", fr: "Transcrit de l'édition anglaise du calendrier 2026 publiée par le RKI lui-même. Les prématurés reçoivent une dose supplémentaire d'hexavalent et de pneumocoque à 3 mois. La grippe n'est PAS un vaccin infantile de routine en Allemagne (groupes à risque uniquement).", de: "Abgeschrieben aus der englischen Ausgabe des Impfkalenders 2026 des RKI selbst. Frühgeborene erhalten mit 3 Monaten eine zusätzliche Dosis der Sechsfachimpfung und der Pneumokokken-Impfung. Grippe ist in Deutschland KEINE Routineimpfung für Kinder (nur Risikogruppen).", ru: "Переписано из английского издания календаря 2026 года, выпущенного самим RKI. Недоношенные дети получают дополнительную дозу шестивалентной и пневмококковой вакцины в 3 месяца. Грипп в Германии НЕ входит в рутинный детский календарь (только группы риска).", ar: "منقول عن النسخة الإنجليزية لتقويم 2026 الصادرة عن RKI نفسه. ويحصل الخدّج على جرعة إضافية من السداسي والمكورات الرئوية في الشهر الثالث. والإنفلونزا ليست تطعيما روتينيا للأطفال في ألمانيا (فئات الخطر فقط).", pt: "Transcrito da edição em inglês do próprio RKI do calendário 2026. Os prematuros recebem uma dose extra da hexavalente e do pneumocócico aos 3 meses. A gripe NÃO é vacina infantil de rotina na Alemanha (apenas grupos de risco).", hi: "2026 के कैलेंडर के RKI वाले अंग्रेज़ी संस्करण से उतारा गया। समय से पहले जन्मे शिशुओं को 3 महीने पर 6-in-1 और न्यूमोकोकल की एक अतिरिक्त ख़ुराक मिलती है। जर्मनी में फ़्लू का टीका बच्चों के आम कैलेंडर में नहीं है (सिर्फ़ जोखिम वाले समूहों के लिए)।"}
    schedule:
      - {age: 0, label: {en: "Birth (in RSV season)", es: "Al nacer (en temporada VRS)", fr: "À la naissance (en saison VRS)", de: "Bei der Geburt (in der RSV-Saison)", ru: "При рождении (в сезон РСВ)", ar: "عند الولادة (في موسم الفيروس المخلوي)", pt: "Ao nascer (na temporada do VSR)", hi: "जन्म (RSV के मौसम में)"}, vaccines: ["RSV: nirsevimab/clesrovimab antibody (babies born Oct–Mar: right after birth; born Apr–Sep: the autumn before their first RSV season)"]}
      - {age: 1, label: {en: "From 6 weeks", es: "Desde las 6 semanas", fr: "À partir de 6 semaines", de: "Ab 6 Wochen", ru: "С 6 недель", ar: "من 6 أسابيع", pt: "A partir das 6 semanas", hi: "6 हफ़्ते से"}, vaccines: ["Rotavirus (G1; 2 or 3 doses depending on the vaccine, ≥4 weeks apart)"]}
      - {age: 2, label: {en: "2 months", es: "2 meses", fr: "2 mois", de: "2 Monate", ru: "2 месяца", ar: "شهران", pt: "2 meses", hi: "2 महीने"}, vaccines: ["6-in-1 Tdap-Hib-IPV-HepB (G1)", "Pneumococcal (G1)", "Meningococcal B — MenB (G1)", "Rotavirus (G2)"]}
      - {age: 4, label: {en: "4 months", es: "4 meses", fr: "4 mois", de: "4 Monate", ru: "4 месяца", ar: "4 أشهر", pt: "4 meses", hi: "4 महीने"}, vaccines: ["6-in-1 Tdap-Hib-IPV-HepB (G2)", "Pneumococcal (G2)", "MenB (G2)", "Rotavirus (G3, some vaccines)"]}
      - {age: 11, label: {en: "11 months", es: "11 meses", fr: "11 mois", de: "11 Monate", ru: "11 месяцев", ar: "11 شهرا", pt: "11 meses", hi: "11 महीने"}, vaccines: ["6-in-1 Tdap-Hib-IPV-HepB (G3)", "Pneumococcal (G3)", "Measles-mumps-rubella MMR (G1)", "Varicella (G1)"]}
      - {age: 12, label: {en: "12 months", es: "12 meses", fr: "12 mois", de: "12 Monate", ru: "12 месяцев", ar: "12 شهرا", pt: "12 meses", hi: "12 महीने"}, vaccines: ["MenB (G3)"]}
      - {age: 15, label: {en: "15 months", es: "15 meses", fr: "15 mois", de: "15 Monate", ru: "15 месяцев", ar: "15 شهرا", pt: "15 meses", hi: "15 महीने"}, vaccines: ["MMR (G2)", "Varicella (G2)"]}
      - {age: 66, label: {en: "5–6 years", es: "5-6 años", fr: "5-6 ans", de: "5-6 Jahre", ru: "5-6 лет", ar: "5-6 سنوات", pt: "5-6 anos", hi: "5–6 साल"}, vaccines: ["Tdap booster (A1)"]}
      - {age: 108, label: {en: "9–14 years", es: "9-14 años", fr: "9-14 ans", de: "9-14 Jahre", ru: "9-14 лет", ar: "9-14 سنة", pt: "9-14 anos", hi: "9–14 साल"}, vaccines: ["HPV (G1+G2, ≥5 months apart; 3 doses if started at ≥15 years)", "Tdap booster (A2)", "Polio booster (A1)"]}
      - {age: 144, label: {en: "12–14 years", es: "12-14 años", fr: "12-14 ans", de: "12-14 Jahre", ru: "12-14 лет", ar: "12-14 سنة", pt: "12-14 anos", hi: "12–14 साल"}, vaccines: ["Meningococcal ACWY (G1) — new in the 2026 calendar, replacing the old MenC dose at 12 months"]}
