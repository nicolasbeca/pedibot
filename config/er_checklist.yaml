items:
  - {level: call_now, cat: piel, es: "Mala coloración: palidez, piel moteada, coloración azul o grisácea", en: "Poor colour: pallor, mottled skin, blue or greyish colour", fr: "Mauvaise coloration : pâleur, peau marbrée, coloration bleue ou grisâtre", de: "Schlechte Hautfarbe: Blässe, marmorierte Haut, blaue oder gräuliche Färbung", ru: "Плохой цвет кожи: бледность, мраморность, синюшный или сероватый оттенок", ar: "لون بشرة غير طبيعي: شحوب، تبقع الجلد، ازرقاق أو لون رمادي", pt: "Coloração ruim: palidez, pele mosqueada, coloração azulada ou acinzentada"}
  - {level: call_now, cat: piel, es: "Aparición súbita de manchas en la piel, hinchazón de labios o párpados (sospecha de alergia) con dificultad para respirar, vómitos o mareo", en: "Sudden skin blotches, swollen lips or eyelids (suspected allergy) with breathing difficulty, vomiting or dizziness", fr: "Taches sur la peau d'apparition brutale, lèvres ou paupières gonflées (allergie suspectée) avec gêne respiratoire, vomissements ou vertiges", de: "Plötzliche Flecken auf der Haut, geschwollene Lippen oder Augenlider (Verdacht auf Allergie) mit Atemnot, Erbrechen oder Schwindel", ru: "Внезапные пятна на коже, отёк губ или век (подозрение на аллергию) с затруднённым дыханием, рвотой или головокружением", ar: "بقع مفاجئة على الجلد، أو تورم الشفتين أو الجفون (اشتباه بحساسية) مع صعوبة في التنفس أو قيء أو دوخة", pt: "Aparecimento súbito de manchas na pele, inchaço dos lábios ou das pálpebras (suspeita de alergia) com dificuldade para respirar, vômitos ou tontura"}
