source: seup_acudir_urgencias
source_label: {es: "SEUP — ¿Debo acudir a urgencias? Guía rápida para padres y cuidadores", en: "SEUP (Spanish paediatric emergency doctors) — Should I go to the emergency department? Quick guide for parents", fr: "SEUP (urgentistes pédiatriques espagnols) — Dois-je aller aux urgences ? Guide rapide pour les parents et les accompagnants", de: "SEUP (spanische Notfall-Kinderärzte) — Soll ich in die Notaufnahme? Kurzleitfaden für Eltern und Betreuende", ru: "SEUP (испанские врачи детской неотложной помощи) — Нужно ли ехать в приёмное отделение? Краткое руководство для родителей и тех, кто заботится о ребёнке", ar: "SEUP (أطباء طوارئ الأطفال في إسبانيا) — هل أذهب إلى قسم الطوارئ؟ دليل سريع للوالدين ولمن يرعى الطفل", pt: "SEUP (médicos de emergência pediátrica da Espanha) — Devo levar meu filho ao pronto-socorro? Guia rápido para pais e cuidadores"}
levels:
  call_now: {es: "Llame al 112 o acuda a urgencias de forma inmediata si…", en: "Call the emergency number or go to the emergency department immediately if…", fr: "Appelez le numéro d'urgence ou allez immédiatement aux urgences si…", de: "Rufen Sie die Notrufnummer an oder fahren Sie sofort in die Notaufnahme, wenn…", ru: "Звоните в скорую или немедленно везите ребёнка в приёмное отделение, если…", ar: "اتصل برقم الطوارئ أو توجّه فورا إلى قسم الطوارئ إذا…", pt: "Ligue para o número de emergência ou vá imediatamente ao pronto-socorro se…"}
  go_today: {es: "Acuda a urgencias si…", en: "Go to the emergency department if…", fr: "Allez aux urgences si…", de: "Fahren Sie in die Notaufnahme, wenn…", ru: "Везите ребёнка в приёмное отделение, если…", ar: "توجّه إلى قسم الطوارئ إذا…", pt: "Vá ao pronto-socorro se…"}
  gp: {es: "No urgente: pida consulta en su pediatra si…", en: "Not urgent: book an appointment with your paediatrician if…", fr: "Non urgent : prenez rendez-vous avec votre pédiatre si…", de: "Nicht dringend: Vereinbaren Sie einen Termin bei Ihrer Kinderärztin, wenn…", ru: "Не срочно: запишитесь к педиатру, если…", ar: "غير عاجل: احجز موعدا مع طبيب الأطفال إذا…", pt: "Não urgente: marque uma consulta com o seu pediatra se…"}
