# "¿Debo acudir a urgencias?" — transcripción estructurada de la hoja SEUP para padres y cuidadores
# (FUENTES/Subidos/acudir_urgencias.pdf, https://seup.org/pdf_public/pub/hojas_padres/acudir_urgencias.pdf).
# Determinista, sin IA (idea I-02). Cada ítem lleva su categoría y el nivel de la hoja:
#   call_now  = "Llame al 112 o acuda a urgencias de forma inmediata si"
#   go_today  = "Acuda a urgencias si"
#   gp        = "No urgente, pida consulta en su pediatra si"
source: seup_acudir_urgencias
source_label: {es: "SEUP — ¿Debo acudir a urgencias? Guía rápida para padres y cuidadores", en: "SEUP (Spanish paediatric emergency doctors) — Should I go to the emergency department? Quick guide for parents", fr: "SEUP (urgentistes pédiatriques espagnols) — Dois-je aller aux urgences ? Guide rapide pour les parents et les accompagnants"}
levels:
  call_now: {es: "Llame al 112 o acuda a urgencias de forma inmediata si…", en: "Call the emergency number or go to the emergency department immediately if…", fr: "Appelez le numéro d'urgence ou allez immédiatement aux urgences si…"}
  go_today: {es: "Acuda a urgencias si…", en: "Go to the emergency department if…", fr: "Allez aux urgences si…"}
  gp: {es: "No urgente: pida consulta en su pediatra si…", en: "Not urgent: book an appointment with your paediatrician if…", fr: "Non urgent : prenez rendez-vous avec votre pédiatre si…"}
categories:
  piel: {es: "Piel", en: "Skin", fr: "Peau"}
  comportamiento: {es: "Comportamiento", en: "Behaviour", fr: "Comportement"}
  respiracion: {es: "Respiración", en: "Breathing", fr: "Respiration"}
  fiebre: {es: "Fiebre", en: "Fever", fr: "Fièvre"}
  gastrointestinal: {es: "Tripa y vómitos", en: "Tummy and vomiting", fr: "Ventre et vomissements"}
  accidentes: {es: "Accidentes", en: "Accidents", fr: "Accidents"}
  otro: {es: "Otros", en: "Other", fr: "Autres"}
items:
  - {level: call_now, cat: piel, es: "Mala coloración: palidez, piel moteada, coloración azul o grisácea", en: "Poor colour: pallor, mottled skin, blue or greyish colour", fr: "Mauvaise coloration : pâleur, peau marbrée, coloration bleue ou grisâtre"}
  - {level: call_now, cat: piel, es: "Aparición súbita de manchas en la piel, hinchazón de labios o párpados (sospecha de alergia) con dificultad para respirar, vómitos o mareo", en: "Sudden skin blotches, swollen lips or eyelids (suspected allergy) with breathing difficulty, vomiting or dizziness", fr: "Taches sur la peau d'apparition brutale, lèvres ou paupières gonflées (allergie suspectée) avec gêne respiratoire, vomissements ou vertiges"}
  - {level: call_now, cat: comportamiento, es: "No responde a estímulos", en: "Not responding to stimuli", fr: "Ne réagit pas aux stimulations"}
  - {level: call_now, cat: comportamiento, es: "Irritabilidad o somnolencia excesivas", en: "Excessive irritability or drowsiness", fr: "Irritabilité ou somnolence excessives"}
  - {level: call_now, cat: comportamiento, es: "Movimientos anormales (convulsión)", en: "Abnormal movements (seizure)", fr: "Mouvements anormaux (convulsion)"}
  - {level: call_now, cat: respiracion, es: "Dificultad para respirar grave: se marcan las costillas, respira muy rápido o hace pausas en la respiración, adormilado", en: "Severe breathing difficulty: ribs pulling in, very fast breathing or pauses in breathing, drowsy", fr: "Gêne respiratoire sévère : creusement des côtes, respiration très rapide ou pauses respiratoires, somnolence"}
  - {level: call_now, cat: respiracion, es: "Atragantamiento y dificultad para respirar, o vómitos/salivación constante", en: "Choking with breathing difficulty, or constant vomiting/drooling", fr: "Étouffement avec gêne respiratoire, ou vomissements/bave en continu"}
  - {level: call_now, cat: accidentes, es: "Herida profunda con sangrado abundante que no cede tras aplicar presión durante 10 minutos", en: "Deep wound with heavy bleeding that does not stop after 10 minutes of pressure", fr: "Plaie profonde qui saigne abondamment et ne s'arrête pas après 10 minutes de compression"}
  - {level: call_now, cat: accidentes, es: "Fractura abierta (se ve el hueso)", en: "Open fracture (bone visible)", fr: "Fracture ouverte (os visible)"}
  - {level: call_now, cat: accidentes, es: "Golpe en la cabeza con pérdida de conocimiento", en: "Head injury with loss of consciousness", fr: "Traumatisme crânien avec perte de connaissance"}
  - {level: go_today, cat: piel, es: "Manchas rojas en la piel que no desaparecen al presionar", en: "Red spots on the skin that do not fade when pressed", fr: "Taches rouges sur la peau qui ne s'effacent pas à la pression"}
  - {level: go_today, cat: piel, es: "Aparición súbita de manchas en la piel o hinchazón de labios o párpados sin otros síntomas", en: "Sudden skin blotches or swollen lips/eyelids without other symptoms", fr: "Taches sur la peau d'apparition brutale ou lèvres/paupières gonflées sans autre symptôme"}
  - {level: go_today, cat: fiebre, es: "Bebé menor de 3 meses con fiebre (≥ 38 °C)", en: "Baby under 3 months with fever (≥ 38 °C / 100.4 °F)", fr: "Nourrisson de moins de 3 mois avec de la fièvre (≥ 38 °C)"}
  - {level: go_today, cat: fiebre, es: "Fiebre que se acompaña de cualquier signo de los apartados de piel, comportamiento o respiración", en: "Fever together with any of the skin, behaviour or breathing signs above", fr: "Fièvre associée à l'un des signes de peau, de comportement ou de respiration ci-dessus"}
  - {level: go_today, cat: fiebre, es: "Fiebre de más de 40,5 °C", en: "Fever above 40.5 °C (105 °F)", fr: "Fièvre supérieure à 40,5 °C"}
  - {level: go_today, cat: comportamiento, es: "Mareo, pérdida de fuerza", en: "Dizziness, loss of strength", fr: "Vertiges, perte de force"}
  - {level: go_today, cat: comportamiento, es: "Expresa pensamientos suicidas", en: "Expresses suicidal thoughts", fr: "Exprime des idées suicidaires"}
  - {level: go_today, cat: respiracion, es: "Dificultad para respirar: se marcan las costillas, respira rápido, «pitido» al respirar", en: "Breathing difficulty: ribs pulling in, fast breathing, wheezing", fr: "Gêne respiratoire : creusement des côtes, respiration rapide, sifflements"}
  - {level: go_today, cat: gastrointestinal, es: "Bebé menor de 1 mes que rechaza las tomas", en: "Baby under 1 month refusing feeds", fr: "Nourrisson de moins de 1 mois qui refuse de téter ou de boire"}
  - {level: go_today, cat: gastrointestinal, es: "Vómitos persistentes o diarrea abundante y frecuente durante más de 24 horas, ojos hundidos, orina poco", en: "Persistent vomiting or heavy, frequent diarrhoea for more than 24 hours, sunken eyes, little urine", fr: "Vomissements persistants ou diarrhée abondante et fréquente depuis plus de 24 heures, yeux creux, urines rares"}
  - {level: go_today, cat: gastrointestinal, es: "Vómitos repetidos y dolor de cabeza fuerte", en: "Repeated vomiting with severe headache", fr: "Vomissements répétés avec un mal de tête intense"}
  - {level: go_today, cat: gastrointestinal, es: "Ingesta de un objeto, sobre todo pilas o imanes", en: "Swallowed an object, especially batteries or magnets", fr: "A avalé un objet, surtout une pile ou des aimants"}
  - {level: go_today, cat: gastrointestinal, es: "Dolor de barriga fuerte, continuo, que empeora", en: "Severe, continuous, worsening tummy pain", fr: "Douleur au ventre intense, continue, qui s'aggrave"}
  - {level: go_today, cat: gastrointestinal, es: "Ingesta de productos tóxicos o sobredosificación de medicamentos", en: "Ingestion of toxic products or medication overdose", fr: "Ingestion de produits toxiques ou surdosage de médicament"}
  - {level: go_today, cat: accidentes, es: "Traumatismo con deformidad aparente", en: "Injury with visible deformity", fr: "Blessure avec déformation visible"}
  - {level: go_today, cat: accidentes, es: "Herida profunda que precisa sutura", en: "Deep wound that needs stitches", fr: "Plaie profonde qui nécessite des points de suture"}
  - {level: gp, cat: piel, es: "Manchas en la piel que desaparecen al presionar", en: "Skin spots that fade when pressed", fr: "Taches sur la peau qui s'effacent à la pression"}
  - {level: gp, cat: fiebre, es: "Bebé entre 3 y 24 meses con temperatura > 39 °C sin datos de alarma", en: "Baby aged 3–24 months with temperature above 39 °C and no warning signs", fr: "Nourrisson de 3 à 24 mois avec une température supérieure à 39 °C et sans signe d'alerte"}
  - {level: gp, cat: fiebre, es: "Fiebre (> 38 °C) durante más de 5 días", en: "Fever (above 38 °C) for more than 5 days", fr: "Fièvre (au-dessus de 38 °C) depuis plus de 5 jours"}
  - {level: gp, cat: respiracion, es: "Tos o mocos sin dificultad para respirar", en: "Cough or runny nose without breathing difficulty", fr: "Toux ou nez qui coule sans gêne respiratoire"}
  - {level: gp, cat: gastrointestinal, es: "Vómitos y/o diarrea sin datos de alarma", en: "Vomiting and/or diarrhoea without warning signs", fr: "Vomissements et/ou diarrhée sans signe d'alerte"}
  - {level: gp, cat: gastrointestinal, es: "Dolor de barriga no muy intenso que viene y va", en: "Mild tummy pain that comes and goes", fr: "Douleur au ventre légère qui va et vient"}
  - {level: gp, cat: otro, es: "Dolor de oído durante más de dos días", en: "Earache for more than two days", fr: "Mal d'oreille depuis plus de deux jours"}
  - {level: gp, cat: otro, es: "Ojo rojo o picor ocular", en: "Red eye or itchy eyes", fr: "Œil rouge ou yeux qui démangent"}
